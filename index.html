<html lang="de">

<body>

<style>
/* Layout: einspaltige App-Hülle (max. 560px), Kopfzeile oben, Tab-Leiste unten, Karten für Ziele */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --fg:#131923; --muted:#5b6678; --line:#d6dce5;
  --accent:#2c56cc; --accent-fg:#ffffff; --accent-soft:#dfe6fa;
  --good:#18924d; --good-soft:#d9f1e3; --bad:#cf3b3b; --warn:#d07c12; --nodata:#c2c9d4;
  --c-steps:#2c56cc; --c-steps-soft:#e3e9fb; --c-food:#0e8a7d; --c-food-soft:#d6f0ec; --c-gym:#7a4fd6; --c-gym-soft:#ece5fb;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06); --tabbar:rgba(255,255,255,.84); --good-card:#18924d;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c25; --surface-2:#212a36; --fg:#e7ebf1; --muted:#95a1b3; --line:#2a3340;
  --accent:#7495ff; --accent-fg:#0d1117; --accent-soft:#1d2946;
  --good:#2bb366; --good-soft:#163524; --bad:#f06262; --warn:#f2a142; --nodata:#3a4351;
  --c-steps:#7f9dff; --c-steps-soft:#1d2946; --c-food:#3cc4b3; --c-food-soft:#12302d; --c-gym:#ab8dff; --c-gym-soft:#29213f;
  --shadow:0 0 0 1px #1f2732; --tabbar:rgba(22,28,37,.86); --good-card:#1a7d47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c25; --surface-2:#212a36; --fg:#e7ebf1; --muted:#95a1b3; --line:#2a3340;
  --accent:#7495ff; --accent-fg:#0d1117; --accent-soft:#1d2946;
  --good:#2bb366; --good-soft:#163524; --bad:#f06262; --warn:#f2a142; --nodata:#3a4351;
  --c-steps:#7f9dff; --c-steps-soft:#1d2946; --c-food:#3cc4b3; --c-food-soft:#12302d; --c-gym:#ab8dff; --c-gym-soft:#29213f;
  --shadow:0 0 0 1px #1f2732; --tabbar:rgba(22,28,37,.86); --good-card:#1a7d47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
header.top h1{font-family:var(--font-display);font-size:28px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{color:var(--muted);font-size:13px}
.backbtn{border:0;background:var(--surface-2);color:var(--fg);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.titlewrap{min-width:0;flex:1}
main{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--font-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 -4px}
.panel{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.list>*{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.list>*:last-child{border-bottom:0}
button.rowbtn{cursor:pointer}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:20px;padding:16px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.card .head{display:flex;align-items:center;gap:8px;font-weight:600}
.card .head svg{width:20px;height:20px}
.card .val{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.card .line2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .detail{color:var(--muted);font-size:14px}
.card.met{background:var(--good-card);color:#fff}
.card.met .detail{color:rgba(255,255,255,.88)}
.card.met .bar{background:rgba(255,255,255,.3)} .card.met .bar i{background:#fff}
.card.missed{border-color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.big{height:12px}
.bar i.good{background:var(--good)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-met{color:var(--good)} .st-missed{color:var(--bad)} .st-pending{color:var(--warn)} .st-nodata{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--surface-2);color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:90px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.minmax{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;flex-wrap:wrap}
.syncline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ring{display:grid;place-items:center;position:relative;margin:6px auto}
.ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.ring .c{position:absolute;text-align:center}
.ring .c b{display:block;font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:16}
.ring .trk{stroke:var(--good-soft)} .ring .prg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .4s}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .b-met{fill:var(--good)} .chart .b-no{fill:var(--accent)} .chart .b-off{fill:var(--surface-2)} .chart .goal{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:1.2}
.chart .avg{stroke:var(--warn);stroke-dasharray:2 3;stroke-width:1.6} .chart text.avg-t{fill:var(--warn)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);font-size:22px;cursor:pointer}
.stepper b{font-family:var(--font-display);font-size:22px;min-width:2ch;text-align:center}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.ex .exname{font-weight:600;font-size:16px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0}
.prev{font-size:13px;color:var(--muted);margin:0}
.setrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto minmax(0,1fr) auto auto 30px;gap:6px;align-items:center}
.setrow input{text-align:right;padding:8px}
.setrow .ps{font-size:12px;color:var(--muted);white-space:nowrap}
.xbtn{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:30px;height:30px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 48px 70px 56px 26px;gap:6px;align-items:end}
.rowflex{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--font-display);font-size:20px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 34px;gap:2px;background:var(--surface);border-radius:var(--r);padding:8px 6px}
.calgrid .wd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.day{border:0;background:none;color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;border-radius:10px;cursor:pointer;min-height:52px}
.day .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--accent);color:var(--accent-fg);font-weight:700}
.day.out{opacity:.35}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--nodata)}
.dot.met{background:var(--good)} .dot.missed{background:var(--bad)} .dot.pending{background:var(--warn)} .dot.nodata{background:var(--nodata)}
.dot.booked{background:var(--accent)} .dot.none{background:transparent}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted)}
.wk .dot{width:10px;height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.steps-guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps-guide li{padding-left:2px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
pre.mono{display:block;padding:10px;white-space:pre;overflow-x:auto;margin:0}
details{background:var(--surface);border-radius:var(--r);padding:12px 16px}
details summary{font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.check{display:flex;align-items:center;gap:10px}
.check input{width:22px;height:22px;flex:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tbl th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tfoot td{font-weight:700;border-bottom:0}
table.tbl tr.click{cursor:pointer}
.pos{color:var(--good)} .neg{color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer;min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sc-good{color:var(--good)} .sc-ok{color:var(--accent)} .sc-warn{color:var(--warn)} .sc-bad{color:var(--bad)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .vl{fill:var(--fg);font-weight:600;font-size:11px}
.wkbtn{border:0;background:none;font:inherit;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;padding:0}
.wkbtn small{font-size:9px;font-weight:500;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--bg);border-radius:22px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--font-display);font-size:24px;margin:0}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:600 15px var(--font-display);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.avatar svg{width:22px;height:22px}
.sexsel{display:flex;gap:6px}
.fc{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.scale{position:relative;height:16px;margin-top:4px}.scale span{position:absolute;transform:translateX(-50%)}.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.panel,.list,.card,details,.calgrid{box-shadow:var(--shadow)}
.card{border-radius:22px;padding:18px;transition:transform .15s ease}
.card:active{transform:scale(.985)}
.card .head{gap:10px}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.card .head .ico svg{width:19px;height:19px}
.ico-steps{background:var(--c-steps-soft);color:var(--c-steps)} .ico-nutrition{background:var(--c-food-soft);color:var(--c-food)} .ico-workout{background:var(--c-gym-soft);color:var(--c-gym)}
.card.met .ico{background:rgba(255,255,255,.22);color:#fff}
.bar i.k-steps{background:var(--c-steps)} .bar i.k-nutrition{background:var(--c-food)} .bar i.k-workout{background:var(--c-gym)}
.bar{height:9px}
nav.tabs{background:var(--tabbar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
header.top h1{font-size:30px}
h2{margin-top:14px}
.bmiwrap{position:relative;padding-top:5px}
.bmi{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.bmi i{display:block;height:100%}
.bmi .z1{width:17.5%;background:var(--warn);opacity:.55}.bmi .z2{width:32.5%;background:var(--good);opacity:.75}.bmi .z3{width:25%;background:var(--warn);opacity:.55}.bmi .z4{width:25%;background:var(--bad);opacity:.6}
.bmimark{position:absolute;top:0;width:5px;height:20px;border-radius:3px;background:var(--fg);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.nexttr{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.nexttr .grow b{display:block;font-size:16px}
.medals{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.medal{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;scroll-snap-align:start;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer;padding:0}
.medal .disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#5a3a00;background:radial-gradient(circle at 32% 28%,#fff6c8 0,#ffd257 32%,#e0a21a 70%,#b9790c 100%);box-shadow:0 0 0 3px #f3c445 inset,0 0 0 2px #fff3 ,0 4px 10px rgba(185,121,12,.35);position:relative}

.medal .dt{font-size:11px;color:var(--muted)}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));z-index:15;background:var(--fg);color:var(--bg);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#rest .rt{display:flex;flex-direction:column}#rest .rt b{font-family:var(--font-display);font-size:28px;line-height:1}
#rest .rb{grid-column:1/-1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;order:3}#rest .rb i{display:block;height:100%;background:var(--bg)}
#rest .ra{display:flex;gap:6px}#rest .ra button{border:0;border-radius:10px;padding:8px 10px;font:600 13px var(--font-body);background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);cursor:pointer}

<script>
"use strict";
/* ---------- Grunddaten ---------- */
const ICON={
  steps:'<svg class="i" viewBox="0 0 24 24"><path d="M8 3c1.7 0 3 2 3 4.5S10 12 8 12s-3-2-3-4.5S6.3 3 8 3zM6 14h4l-.5 4a2 2 0 0 1-3 0zM16 7c1.7 0 3 2 3 4.5S18 16 16 16s-3-2-3-4.5S14.3 7 16 7zM14 18h4l-.5 2.5a2 2 0 0 1-3 0z"/></svg>',
  nutrition:'<svg class="i" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 0-3 3-3 7h3v11"/></svg>',
  workout:'<svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>'
};
const GOALS={steps:{t:'Schritte'},nutrition:{t:'Ernährung'},workout:{t:'Krafttraining'}};
const NUTR=[['kcal','Kalorien','kcal'],['protein','Protein','g'],['fat','Fett','g'],['carbs','Kohlenhydrate','g'],['fiber','Ballaststoffe','g']];
const STATUS={met:'erreicht',missed:'verfehlt',pending:'läuft noch',nodata:'keine Daten'};
const KEY='fitdash.v1';

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const todayKey=()=>ymd(new Date());
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmtInt=n=>Math.round(n||0).toLocaleString('de-DE');
const fmt1=n=>(Math.round((n||0)*10)/10).toLocaleString('de-DE',{maximumFractionDigits:1});
const fmtRaw=n=>n==null?'':String(Math.round(n*10)/10).replace('.',',');
const fmtDay=k=>parseYmd(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const fmtDayLong=k=>parseYmd(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $=s=>document.querySelector(s);

// Werte aus dem Kurzbefehl: ohne Tausendertrennung, Komma oder Punkt = Dezimalzeichen (z. B. 285,956)
function parseImportNum(s){
  const m=String(s??'').match(/-?\d+(?:[.,]\d+)?/); if(!m) return null;
  const n=parseFloat(m[0].replace(',','.')); return isFinite(n)?n:null;
}
function parseNum(s){
  const m=String(s??'').match(/-?[\d.,]+/); if(!m) return null;
  let t=m[0];
  if(t.includes('.')&&t.includes(',')){
    t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  }else if(t.includes(',')){
    const p=t.split(','); t=(p.length===2&&p[1].length!==3)?t.replace(',','.'):t.replace(/,/g,'');
  }else if(t.includes('.')){
    const p=t.split('.'); if(p.length>2||p[1].length===3) t=t.replace(/\./g,'');
  }
  const n=parseFloat(t); return isFinite(n)?n:null;
}

/* ---------- Speicher ---------- */
const MEASURES_DEFAULT=['Hals','Brust','Taille','Bauch','Hüfte','Oberarm','Oberschenkel','Wade','Körperfett'];
const mUnit=n=>/fett/i.test(n)?'%':'cm';
// Anleitung zum Anlegen des Maßbands, damit immer an derselben Stelle gemessen wird
const MEASURE_HOWTO={
  'Hals':'Knapp unterhalb des Kehlkopfs. Das Band vorne leicht nach unten neigen, Kopf gerade, Blick nach vorn.',
  'Brust':'Auf Höhe der Brustwarzen, unter den Achseln durch. Arme locker hängen lassen, normal ausatmen.',
  'Taille':'An der schmalsten Stelle zwischen unterster Rippe und Beckenknochen, meist ca. 2–3 cm über dem Bauchnabel. Nach normalem Ausatmen, Bauch nicht einziehen.',
  'Bauch':'Genau auf Höhe des Bauchnabels. Entspannt stehen, nach normalem Ausatmen, Bauch nicht einziehen.',
  'Hüfte':'An der breitesten Stelle des Gesäßes. Füße zusammen, Gewicht auf beiden Beinen.',
  'Oberarm':'Rechter Arm, in der Mitte zwischen Schulter und Ellenbogen. Arm locker hängen lassen, nicht anspannen.',
  'Oberschenkel':'Rechtes Bein, an der dicksten Stelle, ca. eine Handbreit unter dem Schritt. Stehend, Gewicht auf beiden Beinen.',
  'Wade':'Rechtes Bein, an der dicksten Stelle der Wade. Stehend, Gewicht auf beiden Beinen.',
  'Körperfett':'Kein Maßband: Wert von Körperfettwaage oder Messung eintragen. Immer gleiche Tageszeit, z. B. morgens nüchtern.'
};
const howto=n=>MEASURE_HOWTO[n]||'Eigenes Maß: Merk dir die Stelle genau (z. B. Abstand zu einem Knochen) und miss immer gleich.';
function defaults(){return{settings:{dashboard:['steps','nutrition','workout'],stepGoal:10000,stepWeekAvg:10000,nutrition:{},weekly:4,shortcut:'FitDash Sync',bmr:null,theme:'system',proteinPerKg:null,measures:[...MEASURES_DEFAULT]},days:{},body:{},templates:[],sessions:[],demo:false,lastSync:null,recapSeen:null,profile:{name:'',sex:null,height:null,birth:null,targetWeight:null,goalStart:null,pace:0.5},lastBackup:null}}
// Wiederholungen als Bereich, z. B. 6–10
function repRange(e){if(!e)return '';if(e.repsMin!=null)return e.repsMin===e.repsMax?String(e.repsMin):`${e.repsMin}–${e.repsMax}`;return e.reps!=null?String(e.reps):''}
function parseRange(v){const m=String(v??'').match(/(\d+)\s*(?:[-–—\/]|bis|\s)\s*(\d+)/i);
  if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];return{repsMin:Math.max(1,a),repsMax:Math.max(1,b)}}
  const n=parseInt(v);return n>0?{repsMin:n,repsMax:n}:null}
function migrateTemplates(st){(st.templates||[]).forEach(t=>t.exercises.forEach(e=>{if(e.repsMin==null){const n=parseInt(e.reps)||10;e.repsMin=n;e.repsMax=n}delete e.reps}))}
const MY_PLAN="Dienstag – Torso A\n1\tSchrägbank Kurzhantel\t2\t6–10\n2\tLatzug breit\t2\t6–10\n3\tRudern eng am Kabel\t2\t6–10\n4\tButterfly\t2\t8–12\n5\tSeitheben Kabel\t2\t8–12\n6\tReverse Butterfly\t2\t8–12\n7\tBauchpresse\t2\t8–12\n\nMittwoch – Limbs A\n1\tBeinpresse\t2\t6–10\n2\tRückenstrecker, hüftdominant\t2\t8–12\n3\tBeinbeuger\t2\t8–12\n4\tBeinstrecker\t2\t8–12\n5\tWadenmaschine\t2\t8–12\n6\tPreacher Curls\t3\t8–12\n7\tTrizeps Cable Pushdown\t3\t8–12\n\nDonnerstag – Torso B\n1\tT-Bar Rudern\t2\t6–10\n2\tSchrägbank Kurzhantel\t2\t6–10\n3\tLatzug breit\t2\t6–10\n4\tSchulterpresse Maschine\t2\t6–10\n5\tButterfly\t2\t8–12\n6\tSeitheben Kabel\t2\t8–12\n7\tReverse Butterfly\t2\t8–12\n\nSamstag – Limbs B\n1\tBeinbeuger\t2\t8–12\n2\tBeinpresse\t2\t6–10\n3\tRückenstrecker, hüftdominant\t2\t8–12\n4\tBeinstrecker\t2\t8–12\n5\tWadenmaschine\t2\t8–12\n6\tHammercurls am Kabel\t3\t8–12\n7\tTrizeps Overhead Cable Extension\t3\t8–12\n8\tBauchpresse\t2\t8–12";
// Trainingsplan als Text: Überschrift = Einheit, Zeilen = Nr. Übung Sätze Wdh.
function parsePlan(text){
  const out=[];let cur=null;
  for(let line of String(text).split(/\r?\n/)){
    line=line.replace(/\u00a0/g,' ').trim(); if(!line||/^nr\.?(\s|\t|$)/i.test(line)||/^(gesamt|summe)\b/i.test(line)) continue;
    const cols=line.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    let name,sets,reps;
    if(cols.length>=4&&/^\d+$/.test(cols[0])){[,name,sets,reps]=cols}
    else{const m=line.match(/^\d+[.)]?\s+(.+?)\s+(\d+)\s*(?:x|×)?\s+(\d+\s*(?:[-–—]|bis)\s*\d+|\d+)\s*(?:wdh\.?)?$/i);if(m){[,name,sets,reps]=m}}
    if(name&&!cur){cur={name:'Einheit '+(out.length+1),exercises:[]};out.push(cur)}
    if(name&&cur){const r=parseRange(reps);cur.exercises.push({name,sets:Math.max(1,parseInt(sets)||1),...(r||{repsMin:10,repsMax:10})})}
    else if(!/^\d/.test(line)){cur={name:line.replace(/\s+[-–]\s+/,' – '),exercises:[]};out.push(cur)}
  }
  return out.filter(t=>t.exercises.length);
}
function targetFor(d,name){const t=d.templateId&&S.templates.find(x=>x.id===d.templateId);return t&&t.exercises.find(e=>norm(e.name)===norm(name))}
function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw){const s=Object.assign(defaults(),JSON.parse(raw));s.settings=Object.assign(defaults().settings,s.settings);s.profile=Object.assign(defaults().profile,s.profile||{});migrateTemplates(s);if(!s.settings.halsAdded){if(!s.settings.measures.includes('Hals'))s.settings.measures.unshift('Hals');s.settings.halsAdded=true}return s}}catch(e){}
  const d=defaults();seedDemo(d);return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function snapNow(){return{stepGoal:S.settings.stepGoal,nutrition:JSON.parse(JSON.stringify(effNutrition()))}}
function upsertDay(k,vals){
  const isNew=!S.days[k]; const d=S.days[k]||(S.days[k]={});
  Object.assign(d,vals);
  if(isNew||k===todayKey()||!d.snap) d.snap=snapNow();
}

function seedDemo(d){
  d.demo=true;
  d.profile={name:'Beispiel',sex:'m',height:182,birth:'1994-05-12',targetWeight:78,goalStart:{date:ymd(addDays(new Date(),-84)),weight:86.1}};
  d.settings.nutrition={kcal:{min:null,max:2300},protein:{min:120,max:null},fiber:{min:25,max:null}};
  const t=new Date(); const snap={stepGoal:10000,nutrition:JSON.parse(JSON.stringify(d.settings.nutrition))};
  for(let i=83;i>=0;i--){
    const k=ymd(addDays(t,-i)); const r=((i*37)%100)/100;
    d.days[k]={steps:Math.round(5600+r*8200),active:Math.round(280+r*380),resting:Math.round(1690+((i*7)%40)),kcal:Math.round(1760+((i*53)%60)*9),
      protein:Math.round(98+((i*29)%45)),fat:Math.round(52+((i*17)%34)),carbs:Math.round(170+((i*41)%110)),fiber:Math.round(17+((i*13)%15)),snap};
  }
  d.days[ymd(t)]={steps:10420,active:512,resting:1702,kcal:1540,protein:104,fat:48,carbs:150,fiber:19,snap};
  const r1=x=>Math.round(x*10)/10;
  for(let i=84;i>=0;i-=2) d.body[ymd(addDays(t,-i))]={weight:r1(82.3+i*0.045+(((i*31)%7)-3)*0.12)};
  for(let i=84;i>=0;i-=14) Object.assign(d.body[ymd(addDays(t,-i))],{Hals:r1(39.5+i*0.008),Brust:r1(103-(84-i)*0.012),Taille:r1(90.5+i*0.05),Bauch:r1(93+i*0.06),'Hüfte':r1(100+i*0.03),Oberarm:r1(36+(84-i)*0.008),Oberschenkel:r1(58.5+i*0.012),Wade:39,'Körperfett':r1(20.5+i*0.035)});
  const tp={id:'demo-push',name:'Push',exercises:[{name:'Bankdrücken',sets:3,repsMin:6,repsMax:8},{name:'Schulterdrücken',sets:3,repsMin:8,repsMax:10},{name:'Dips',sets:3,repsMin:8,repsMax:12},{name:'Trizepsdrücken',sets:3,repsMin:10,repsMax:12}]};
  const tl={id:'demo-pull',name:'Pull',exercises:[{name:'Klimmzüge',sets:3,repsMin:6,repsMax:10},{name:'Langhantelrudern',sets:3,repsMin:8,repsMax:10},{name:'Bizepscurls',sets:3,repsMin:10,repsMax:12}]};
  const tb={id:'demo-legs',name:'Beine',exercises:[{name:'Kniebeugen',sets:4,repsMin:5,repsMax:8},{name:'Rumänisches Kreuzheben',sets:3,repsMin:6,repsMax:10},{name:'Beinpresse',sets:3,repsMin:10,repsMax:12},{name:'Wadenheben',sets:4,repsMin:12,repsMax:15}]};
  d.templates=[tp,tl,tb];
  const base={'Bankdrücken':55,'Schulterdrücken':27.5,'Dips':0,'Trizepsdrücken':17.5,'Klimmzüge':0,'Langhantelrudern':45,'Bizepscurls':10,'Kniebeugen':70,'Rumänisches Kreuzheben':60,'Beinpresse':100,'Wadenheben':50};
  const inc={'Bankdrücken':1.25,'Schulterdrücken':0.6,'Trizepsdrücken':0.5,'Langhantelrudern':1,'Bizepscurls':0.3,'Kniebeugen':1.8,'Rumänisches Kreuzheben':1.5,'Beinpresse':3,'Wadenheben':1.2};
  const rot=[tp,tl,tb]; let n=0;
  for(let w=11;w>=0;w--){
    const ws=addDays(weekStart(t),-7*w); const offs=w%2?[0,2,4]:[0,1,3,5];
    offs.forEach(off=>{const date=addDays(ws,off); if(date>t) return; const tmpl=rot[n%3];
      d.sessions.push({id:'demo-s'+n,ts:date.getTime(),date:ymd(date),templateId:tmpl.id,title:tmpl.name,
        exercises:tmpl.exercises.map(e=>({name:e.name,sets:Array.from({length:e.sets},(_,j)=>({w:base[e.name]?Math.round((base[e.name]+(11-w)*(inc[e.name]||0))*2)/2:0,r:Math.max(e.repsMax-(j===e.sets-1?1:0),1)}))}))});
      n++;});
  }
  d.lastSync=Date.now()-1000*60*42;
}

let S=load();

/* ---------- Auswertung ---------- */
const isSet=t=>t&&(t.min!=null||t.max!=null);
const isMet=(t,v)=>!((t.min!=null&&v<t.min)||(t.max!=null&&v>t.max));
function stepGoalFor(k){const d=S.days[k];return(k!==todayKey()&&d&&d.snap&&d.snap.stepGoal)?d.snap.stepGoal:S.settings.stepGoal}
function targetsFor(k){const d=S.days[k];return(k!==todayKey()&&d&&d.snap&&d.snap.nutrition)?d.snap.nutrition:effNutrition()}
function stepsStatus(k){
  const isT=k===todayKey(),d=S.days[k];
  if(!d||d.steps==null) return isT?'pending':'nodata';
  if(d.steps>=stepGoalFor(k)) return 'met';
  return isT?'pending':'missed';
}
const hasNutr=d=>d&&NUTR.some(([k])=>(d[k]||0)>0);
function nutrStatus(k){
  const isT=k===todayKey(),tg=targetsFor(k),act=NUTR.filter(([n])=>isSet(tg[n]));
  if(!act.length) return 'nodata';
  const d=S.days[k]; if(!hasNutr(d)) return isT?'pending':'nodata';
  if(act.every(([n])=>isMet(tg[n],d[n]||0))) return 'met';
  if(isT) return act.some(([n])=>tg[n].max!=null&&(d[n]||0)>tg[n].max)?'missed':'pending';
  return 'missed';
}
function nutrientStatus(t,v){if(!isSet(t))return 'nodata';if(isMet(t,v))return 'met';if(t.max!=null&&v>t.max)return 'missed';return 'pending'}
function weekCount(ws){const s=ymd(ws),e=ymd(addDays(ws,7));return S.sessions.filter(x=>x.date>=s&&x.date<e).length}
function weekStatus(ws){
  const c=weekCount(ws); if(c>=S.settings.weekly) return 'met';
  const now=new Date(); if(ws>now) return 'nodata';
  return addDays(ws,7)>now?'pending':'missed';
}
const chip=s=>`<span class="chip st-${s}">${STATUS[s]}</span>`;
const bar=(p,cls='',big=false)=>`<div class="bar${big?' big':''}"><i class="${cls}" style="width:${Math.max(0,Math.min(1,isFinite(p)?p:0))*100}%"></i></div>`;
const targetText=(t,u)=>!isSet(t)?'Kein Ziel festgelegt':(t.min!=null&&t.max!=null)?`Ziel: ${fmt1(t.min)}–${fmt1(t.max)} ${u}`:t.min!=null?`Ziel: mind. ${fmt1(t.min)} ${u}`:`Ziel: max. ${fmt1(t.max)} ${u}`;
const sortedSessions=()=>[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
const setsSummary=sets=>sets.map(s=>`${fmt1(s.w)} kg × ${s.r}`).join(', ');

/* ---------- Energiebilanz & Wochenbewertung ---------- */
const KCAL_PER_KG=7700;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function burnedFor(d){if(!d)return 0;const rest=d.resting>0?d.resting:(S.settings.bmr||estBMR()||0);return(d.active||0)+rest}
function restingMissing(keys){return !S.settings.bmr&&!estBMR()&&keys.some(k=>hasNutr(S.days[k])&&!(S.days[k].resting>0))}
function deficitRows(ws){
  return Array.from({length:7},(_,i)=>{const k=ymd(addDays(ws,i)),d=S.days[k];
    const has=hasNutr(d);return{k,eaten:has?d.kcal||0:null,burned:d?burnedFor(d):null,def:has?burnedFor(d)-(d.kcal||0):null}});
}
const defText=v=>v==null?'–':(v>=0?'':'+')+fmtInt(Math.abs(v));      // Defizit positiv, Überschuss mit +
const defCls=v=>v==null?'':v>=0?'pos':'neg';
function avgWeight(from,to){const v=Object.entries(S.body).filter(([k,b])=>k>=from&&k<to&&b.weight).map(([,b])=>b.weight);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function weekSummary(ws){
  const tk=todayKey(),keys=Array.from({length:7},(_,i)=>ymd(addDays(ws,i))),past=keys.filter(k=>k<=tk),en=S.settings.dashboard;
  const parts=[];
  if(en.includes('steps')&&S.settings.stepWeekAvg){const w=weekSteps(ws);if(w.sum>0)parts.push({t:'Schritte Ø',met:Math.round(w.done?w.weekAvg:w.avg),ev:S.settings.stepWeekAvg,r:Math.min((w.done?w.weekAvg:w.avg)/S.settings.stepWeekAvg,1),txt:`Ø ${fmtInt(w.done?w.weekAvg:w.avg)} von ${fmtInt(S.settings.stepWeekAvg)}`})}
  if(en.includes('steps')){const st=past.map(stepsStatus),met=st.filter(x=>x==='met').length,ev=st.filter(x=>x==='met'||x==='missed').length;parts.push({t:'Schritte',met,ev,r:ev?met/ev:null,txt:`${met} von ${ev} Tagen`})}

  if(h&&p.sex&&neck){

function goalForecast(){
  const t=S.profile.targetWeight,w=latestWeight();if(!t||!w)return null;
  const diff=t-w.v;if(Math.abs(diff)<0.2)return{reached:true};
  const res={diff};
  // 1) Gewichtstrend: lineare Regression über die letzten 6 Wochen
  const from=ymd(addDays(new Date(),-42)),pts=Object.keys(S.body).filter(k=>k>=from&&S.body[k].weight).sort().map(k=>({x:(parseYmd(k)-parseYmd(from))/864e5,y:S.body[k].weight}));
  if(pts.length>=3&&pts[pts.length-1].x-pts[0].x>=7){
    const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
    const slope=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0)/pts.reduce((a,p)=>a+(p.x-mx)**2,0);
    res.trendPerWeek=slope*7;
    if(Math.sign(slope)===Math.sign(diff)&&Math.abs(slope)>0.001) res.trendWeeks=diff/(slope*7);
  }
  // 2) Kalorienbilanz: Ø Defizit der letzten 14 Tage mit Ernährungsdaten
  const days=Array.from({length:14},(_,i)=>ymd(addDays(new Date(),-1-i))).filter(k=>hasNutr(S.days[k]));

    const avgDef=days.reduce((a,k)=>a+burnedFor(S.days[k])-(S.days[k].kcal||0),0)/days.length;

  ['Gesäß & unterer Rücken',/rückenstrecker|hip ?thrust|gesäß|glute|kreuzheben|hyperext/],['Quadrizeps',/beinpresse|beinstrecker|kniebeuge|squat|ausfallschritt|lunge|hack/],
  ['Waden',/wade|calf/],['Bauch',/bauch|crunch|plank|sit-?up/]];
function muscleOf(n){n=norm(n);const m=MUSCLES.find(([,r])=>r.test(n));return m?m[0]:'Sonstige'}
function volume(from,to){const v={};S.sessions.filter(s=>s.date>=from&&s.date<to).forEach(s=>s.exercises.forEach(e=>{const n=e.sets.filter(x=>x.r>0).length;if(n){const m=muscleOf(e.name);v[m]=(v[m]||0)+n}}));return v}
const WEEKDAYS_DE=['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
function nextTraining(){
  if(!S.templates.length)return null;
  const tk=todayKey(),doneToday=S.sessions.filter(s=>s.date===tk);
  const dayPlan=S.templates.some(t=>WEEKDAYS_DE.some(w=>norm(t.name).startsWith(w)));
  const today=S.templates.find(t=>norm(t.name).startsWith(WEEKDAYS_DE[new Date().getDay()]));
  const last=sortedSessions().find(s=>S.templates.some(t=>t.id===s.templateId));
  const next=last?S.templates[(S.templates.findIndex(t=>t.id===last.templateId)+1)%S.templates.length]:S.templates[0];
  return{doneToday,dayPlan,today,next};
}

let REST=null,restTick=null,audioCtx=null;
function ensureAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(){try{ensureAudio();[0,.25,.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.18);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec,label){REST={end:Date.now()+sec*1000,label,total:sec,doneAt:null};clearInterval(restTick);restTick=setInterval(drawRest,250);drawRest()}
function drawRest(){const el=$('#rest');if(!REST){el.hidden=true;clearInterval(restTick);return}
  const left=Math.ceil((REST.end-Date.now())/1000);
  if(left<=0&&!REST.doneAt){REST.doneAt=Date.now();beep()}
  if(REST.doneAt&&Date.now()-REST.doneAt>8000){REST=null;el.hidden=true;clearInterval(restTick);return}
  el.hidden=false;el.classList.toggle('over',left<=0);
  const t=Math.max(0,left);
  el.innerHTML=`<div class="rt"><span class="tiny">${left<=0?'Pause vorbei · weiter geht’s':'Pause · '+esc(REST.label)}</span><b class="num">${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</b></div>
    <div class="rb"><i style="width:${Math.max(0,Math.min(1,t/REST.total))*100}%"></i></div>
    <div class="ra"><button data-a="restAdd">+30 s</button><button data-a="restStop">Stopp</button></div>`;
}
function restFor(d,name){const tg=targetFor(d,name);return tg&&tg.rest?tg.rest:(S.settings.restDefault||120)}

let PHOTOS=[];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('fitdash-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbAll(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}catch(e){return[]}}
async function idbPut(o){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(id){const db=await idb();return new Promise(res=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res})}
async function loadPhotos(){PHOTOS=(await idbAll()).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=url})}

template(c){
  const tp=S.templates.find(t=>t.id===c.id); if(!tp) return{title:'Vorlage',html:'<p class="muted">Diese Vorlage gibt es nicht mehr.</p>'};
  const last=sortedSessions().find(s=>s.templateId===tp.id);
  const html=`<button class="btn primary wide" data-a="startSession" data-id="${tp.id}">Training starten und Werte eintragen</button>
    ${last?`<span class="muted small">Zuletzt gebucht: ${fmtDayLong(last.date)}</span>`:''}
    <h2>Übungen</h2><div class="list">${tp.exercises.length?tp.exercises.map(e=>{const pe=last&&last.exercises.find(x=>norm(x.name)===norm(e.name));
      return `<div><span class="grow"><b>${esc(e.name)}</b><br><span class="muted small">${e.sets} Sätze × ${repRange(e)} Wdh.</span>${pe&&pe.sets.length?`<br><span class="muted tiny">Letztes Mal: (${setsSummary(pe.sets)})</span>`:''}</span></div>`}).join(''):'<div class="muted">Keine Übungen. Tippe auf „Vorlage bearbeiten“.</div>'}</div>
    <button class="btn wide" data-a="editTemplate" data-id="${tp.id}">Vorlage bearbeiten</button>`;
  return{title:tp.name,html};
},
tedit(c){
  const d=c.draft;
  const html=`<div class="panel"><label class="field" for="tname">Name der Einheit<input id="tname" type="text" placeholder="z. B. Oberkörper A" value="${esc(d.name)}" data-in="tname"></label></div>
    <h2>Übungen</h2><div class="panel">${d.exercises.map((e,i)=>`<div class="exrow">
      <label class="field" for="te-n-${i}">Übung<input id="te-n-${i}" type="text" value="${esc(e.name)}" placeholder="z. B. Bankdrücken" data-in="tex" data-i="${i}" data-f="name"></label>
      <label class="field" for="te-s-${i}">Sätze<input id="te-s-${i}" type="text" inputmode="numeric" value="${e.sets}" data-in="tex" data-i="${i}" data-f="sets"></label>
      <label class="field" for="te-r-${i}">Wdh.<input id="te-r-${i}" type="text" inputmode="text" autocomplete="off" placeholder="6-10" value="${esc(e.reps)}" data-in="tex" data-i="${i}" data-f="reps"></label>
      <label class="field" for="te-p-${i}">Pause s<input id="te-p-${i}" type="text" inputmode="numeric" placeholder="120" value="${e.rest??''}" data-in="tex" data-i="${i}" data-f="rest"></label>
      <button class="xbtn" data-a="tRm" data-i="${i}" aria-label="Übung löschen">×</button></div>`).join('')}
      <button class="btn sm" data-a="tAdd">+ Übung hinzufügen</button>
      <span class="muted small">Wiederholungen als Bereich eingeben, z. B. <b>6-10</b>, oder als feste Zahl, z. B. <b>8</b>. Pause in Sekunden, leer = 120.</span></div>
    <button class="btn primary wide" data-a="tSave">Vorlage sichern</button>
    ${c.id?(c.confirmDel?`<div class="panel"><span>Vorlage wirklich löschen? Gebuchte Trainings bleiben erhalten.</span><div class="rowflex"><button class="btn" data-a="tDelNo">Abbrechen</button><button class="btn danger" data-a="tDelYes">Löschen</button></div></div>`:`<button class="btn danger wide" data-a="tDel">Vorlage löschen</button>`):''}`;
  return{title:c.id?'Vorlage bearbeiten':'Neue Einheit',html};
},
session(c){
  const d=c.draft,tp=d.templateId&&S.templates.find(t=>t.id===d.templateId);
  const html=`<div class="panel"><label class="field" for="s-title">Titel<input id="s-title" type="text" value="${esc(d.title)}" data-in="sTitle"></label>
      ${d.id?`<label class="field" for="s-date">Datum<input id="s-date" type="date" max="${todayKey()}" value="${d.date}" data-in="sDate"></label>`
        :`<label class="check" for="s-past"><input type="checkbox" id="s-past" ${d.past?'checked':''} data-in="sPast"><span>Vergessenes Training nachtragen (anderer Tag)</span></label>
        ${d.past?`<label class="field" for="s-date">An welchem Tag hast du trainiert?<input id="s-date" type="date" max="${todayKey()}" value="${d.date}" data-in="sDate"></label>`:`<span class="muted small">Wird für heute gebucht.</span>`}`}</div>
    ${d.ex.map((e,i)=>{const prev=prevSets(d,e.name);return `<section class="ex">
      <input class="exname" id="ex-${i}" aria-label="Übung" value="${esc(e.name)}" placeholder="Übung" data-in="exName" data-i="${i}">
      ${(()=>{const tg=targetFor(d,e.name);if(!tg)return '';const up=prev&&prev.length&&prev.every(x=>x.r>=tg.repsMax);
        return `<p class="prev">Ziel: ${tg.sets} × ${repRange(tg)} Wdh.${up?' · <b class="pos">Letztes Mal überall oberes Ende erreicht: Gewicht erhöhen</b>':''}</p>`})()}
      ${prev?`<p class="prev">Letztes Mal: (${setsSummary(prev)})</p>`:''}
      ${e.sets.map((s,j)=>{const p=prev&&prev[j];return `<div class="setrow"><span class="muted">${j+1}.</span>
        <input id="w-${i}-${j}" aria-label="Gewicht Satz ${j+1}" type="text" inputmode="decimal" placeholder="${p?fmtRaw(p.w):'kg'}" value="${esc(s.w)}" data-in="set" data-i="${i}" data-j="${j}" data-f="w"><span class="muted small">kg</span>
        <input id="r-${i}-${j}" aria-label="Wiederholungen Satz ${j+1}" type="text" inputmode="numeric" placeholder="${p?p.r:(targetFor(d,e.name)?repRange(targetFor(d,e.name)):'Wdh')}" value="${esc(s.r)}" data-in="set" data-i="${i}" data-j="${j}" data-f="r"><span class="muted small">Wdh</span>
        <span class="ps">${p?`(${fmt1(p.w)}×${p.r})`:''}</span>
        <button class="xbtn" data-a="sRmSet" data-i="${i}" data-j="${j}" aria-label="Satz löschen">×</button></div>`}).join('')}
      <div class="rowflex"><button class="btn sm" data-a="sAddSet" data-i="${i}">+ Satz</button><button class="btn sm" data-a="restGo" data-i="${i}">Pause ${Math.round(restFor(d,e.name)/60*10)/10} min</button><button class="btn sm danger" data-a="sRmEx" data-i="${i}">Entfernen</button></div></section>`}).join('')}
    <p class="muted small" style="margin:0">Der Pausentimer startet automatisch, wenn du die Wiederholungen eines Satzes einträgst.</p>
    <button class="btn wide" data-a="sAddEx">+ Übung hinzufügen</button>
    ${tp?`<label class="check panel" for="updT"><input type="checkbox" id="updT" ${d.updT?'checked':''} data-in="updT"><span>Geänderte Übungen auch in der Vorlage „${esc(tp.name)}“ speichern</span></label>`:''}
    <p class="muted small" style="margin:0">Übung tauschen: einfach den Namen überschreiben. Die Vorlage bleibt gleich, außer du setzt das Häkchen. Werte in Klammern zeigen das letzte Mal.</p>
    <button class="btn good wide" data-a="sSave">${d.id?'Änderungen sichern':d.date===todayKey()?'Training buchen':'Für '+fmtDay(d.date)+' buchen'}</button>
    ${d.id?(c.confirmDel?`<div class="panel"><span>Dieses Training löschen?</span><div class="rowflex"><button class="btn" data-a="sDelNo">Abbrechen</button><button class="btn danger" data-a="sDelYes">Löschen</button></div></div>`:`<button class="btn danger wide" data-a="sDel">Training löschen</button>`):''}`;
  return{title:d.id?'Training bearbeiten':'Training buchen',html};
},
calendar(c){
  if(!c.month){const n=new Date();c.month=new Date(n.getFullYear(),n.getMonth(),1)}
  const m=c.month,en=S.settings.dashboard,showW=en.includes('workout'),tk=todayKey();
  const first=weekStart(m),end=new Date(m.getFullYear(),m.getMonth()+1,1);
  const byDay={};S.sessions.forEach(s=>byDay[s.date]=(byDay[s.date]||0)+1);
  const weeks=[];
  let grid=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')+`<div class="wd">Wo</div>`;
  for(let ws=first;ws<end;ws=addDays(ws,7)){
    for(let i=0;i<7;i++){
      const day=addDays(ws,i),k=ymd(day),fut=k>tk;
      const dots=[];
      if(en.includes('steps')) dots.push(fut?'none':stepsStatus(k));
      if(en.includes('nutrition')) dots.push(fut?'none':nutrStatus(k));
      if(showW) dots.push(byDay[k]?'booked':'none');
      grid+=`<button class="day${day.getMonth()!==m.getMonth()?' out':''}${k===tk?' today':''}" data-a="day" data-k="${k}" aria-label="${fmtDayLong(k)}"><span class="n">${day.getDate()}</span><span class="dots">${dots.map(s=>`<i class="dot ${s}"></i>`).join('')}</span></button>`;
    }
    if(ws>new Date()) grid+='<div></div>';
    else{const sm=weekSummary(ws);grid+=`<button class="wkbtn ${scoreCls(sm.score)}" data-a="week" data-k="${ymd(ws)}" aria-label="${weekLabel(ws)} ansehen"><span class="num">${sm.score==null?'–':sm.score+'%'}</span><small class="num">${weekCount(ws)}/${S.settings.weekly}</small></button>`;weeks.push(sm)}
  }
  const html=`<div class="cal-head"><button class="btn sm" data-a="month" data-d="-1" aria-label="Vormonat">‹</button><b>${m.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn sm" data-a="month" data-d="1" aria-label="Nächster Monat">›</button></div>
    <div class="calgrid">${grid}</div>
    <div class="panel"><span class="small"><b>Punkte unter jedem Tag, von links:</b> ${en.filter(k=>k!=='workout').map(k=>GOALS[k].t).concat(showW?['Training gebucht']:[]).join(' · ')}</span>
    <div class="legend"><span><i class="dot met"></i>erreicht</span><span><i class="dot missed"></i>verfehlt</span><span><i class="dot pending"></i>läuft noch</span><span><i class="dot nodata"></i>keine Daten</span><span><i class="dot booked"></i>Training</span></div>
    <span class="muted tiny">Spalte „Wo“: Wochenbewertung in Prozent und gebuchte Trainings. Antippen öffnet den Wochenrückblick.</span></div>
    <h2>Wochen in diesem Monat</h2><div class="list">${weeks.length?[...weeks].reverse().map(weekRow).join(''):'<div class="muted">Noch keine Wochen.</div>'}</div>`;
  return{title:'Kalender',html};
},
day(c){
  const k=c.k,d=S.days[k]||{},tg=targetsFor(k),ss=S.sessions.filter(s=>s.date===k);
  const top=`<h2>Schritte</h2><div class="list"><div><span class="grow num">${fmtInt(d.steps)} / ${fmtInt(stepGoalFor(k))}</span>${chip(stepsStatus(k))}</div>
      <div><span class="grow">Aktiv verbrannt</span><span class="num">${fmtInt(d.active)} kcal</span></div></div>
    <h2>Ernährung</h2><div class="list"><div><span class="grow">Status</span>${chip(nutrStatus(k))}</div>
      ${NUTR.map(([n,t,u])=>{const v=d[n]||0,s=nutrientStatus(tg[n],v);return `<div><span class="grow">${t}<br><span class="muted tiny">${targetText(tg[n],u)}</span></span><span class="num">${fmt1(v)} ${u}</span>${s!=='nodata'?`<i class="dot ${s}"></i>`:''}</div>`}).join('')}</div>`;
  const html=`<h2>Krafttraining</h2><div class="list">
      ${ss.map(s=>`<button class="rowbtn" data-a="editSession" data-id="${s.id}"><span class="grow"><b>${esc(s.title)}</b><br><span class="muted small">${esc(s.exercises.map(e=>e.name).join(' · '))}</span></span><span class="muted">›</span></button>`).join('')||'<div class="muted">Kein Training gebucht</div>'}
      <div><span class="grow">Wochenpensum</span><span class="num">${weekCount(weekStart(parseYmd(k)))} / ${S.settings.weekly}</span></div></div>
    ${S.templates.length?`<details><summary>Training an diesem Tag buchen</summary><div class="list">${S.templates.map(t=>`<button class="rowbtn" data-a="startSession" data-id="${t.id}" data-k="${k}"><span class="grow">${esc(t.name)}</span><span class="muted">›</span></button>`).join('')}</div></details>`:''}
    <details><summary>Werte manuell eintragen</summary><div style="display:flex;flex-direction:column;gap:8px">
      <label class="field" for="man-weight">Gewicht (kg)<input id="man-weight" type="text" inputmode="decimal" value="${fmtRaw(S.body[k]?.weight)}" data-in="manualW" data-k="${k}"></label>
      ${[['steps','Schritte'],['active','Aktive kcal'],['resting','Ruheenergie kcal'],...NUTR.map(([n,t,u])=>[n,`${t} (${u})`])].map(([f,t])=>`<label class="field" for="man-${f}">${t}<input id="man-${f}" type="text" inputmode="decimal" value="${fmtRaw(d[f])}" data-in="manual" data-k="${k}" data-f="${f}"></label>`).join('')}
      <span class="muted tiny">Für Tage ohne Sync oder zum Korrigieren.</span></div></details>`;
  return{title:fmtDay(k),sub:fmtDayLong(k),top,html};
},
planImport(c){
  const html=`<div class="panel"><span class="small">Füge deinen Plan als Text ein: Eine Überschrift pro Einheit, darunter je Zeile <b>Nr. · Übung · Sätze · Wdh.</b> Wiederholungsbereiche wie 6–10 werden erkannt. Gibt es schon eine Vorlage mit demselben Namen, wird sie ersetzt.</span>
    <button class="btn sm" data-a="planMine">Meinen Plan (Torso/Limbs) einsetzen</button>
    <label class="field" for="planbox">Trainingsplan<textarea id="planbox" style="min-height:220px" placeholder="Dienstag – Torso A&#10;1  Schrägbank Kurzhantel  2  6–10&#10;2  Latzug breit  2  6–10"></textarea></label>
    <button class="btn" data-a="planPreview">Vorschau</button></div>
    ${c.preview?`<h2>Vorschau</h2>${c.preview.length?c.preview.map(t=>`<div class="panel"><b>${esc(t.name)}</b><span class="small muted">${t.exercises.map(e=>`${esc(e.name)} · ${e.sets} × ${repRange(e)}`).join('<br>')}</span></div>`).join('')+`<button class="btn primary wide" data-a="planSave">${c.preview.length} Vorlagen speichern</button>`:'<p class="muted">Im Text wurde kein Plan erkannt.</p>'}`:''}`;
  return{title:'Plan einfügen',html};
},
week(c){
  const ws=parseYmd(c.k),sm=weekSummary(ws),en=S.settings.dashboard,tk=todayKey();
  const byDay={};S.sessions.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+1);
  const days=`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Tag</th>${en.includes('steps')?'<th>Schritte</th>':''}${en.includes('nutrition')?'<th>Ernährung</th>':''}${en.includes('workout')?'<th>Training</th>':''}</tr></thead><tbody>
    ${sm.keys.map((k,i)=>{const fut=k>tk;return `<tr class="click" data-a="day" data-k="${k}"><td>${WD[i]} <span class="muted small">${parseYmd(k).getDate()}.</span></td>
      ${en.includes('steps')?`<td>${fut?'':`<span class="num">${S.days[k]?fmtInt(S.days[k].steps):'–'}</span> <i class="dot ${stepsStatus(k)}" style="display:inline-block"></i>`}</td>`:''}
      ${en.includes('nutrition')?`<td>${fut?'':`<i class="dot ${nutrStatus(k)}" style="display:inline-block"></i>`}</td>`:''}
      ${en.includes('workout')?`<td>${byDay[k]?byDay[k]+'×':''}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;
  const html=`${weekSummaryHtml(sm)}<h2>Ziele pro Tag</h2><div class="panel">${days}</div>
    <h2>Energiebilanz</h2><div class="panel">${deficitTable(sm.rows,true)}</div>
    <div class="rowflex"><button class="btn sm" data-a="weekNav" data-d="-7">‹ Vorwoche</button>${addDays(ws,7)<=new Date()?'<button class="btn sm" data-a="weekNav" data-d="7">Nächste Woche ›</button>':''}</div>`;
  return{title:weekLabel(ws),sub:weekRange(ws),html};
},
records(){
  const {best,events}=allRecords(),list=Object.values(best).sort((a,b)=>b.date.localeCompare(a.date));
  const html=`<div class="panel small muted">Eine Medaille gibt es, wenn du bei einer Übung dein bisher bestes geschätztes Maximalgewicht übertriffst. Es wird aus Gewicht × Wiederholungen berechnet (Epley-Formel), so zählen auch mehr Wiederholungen mit gleichem Gewicht.</div>
    <h2>Medaillen</h2>${events.length?`<div class="list">${[...events].reverse().map(r=>`<button class="rowbtn" data-a="editSession" data-id="${r.sid}"><span class="medal" style="width:auto"><span class="disc" style="width:40px;height:40px">${ICON.workout}</span></span><span class="grow"><b>${esc(r.name)}</b><br><span class="muted small">${fmtDayLong(r.date)} · ${fmt1(r.w)} kg × ${r.r}</span></span><span class="num small pos">+${fmt1(r.gain)} kg</span></button>`).join('')}</div>`:'<div class="panel muted">Noch keine Medaillen. Die erste Buchung einer Übung legt den Startwert fest.</div>'}
    <h2>Bestwerte je Übung</h2><div class="list">${list.length?list.map(b=>`<div><span class="grow"><b>${esc(b.name)}</b><br><span class="muted small">${fmt1(b.w)} kg × ${b.r} · ${fmtDay(b.date)}</span></span><span class="num">≈ ${fmt1(b.v)} kg</span></div>`).join(''):'<div class="muted">Noch keine Trainings mit Gewicht.</div>'}</div>`;
  return{title:'Bestleistungen',html};
},
photos(c){
  const sel=c.sel||[],a=PHOTOS.find(p=>p.id===sel[0]),b=PHOTOS.find(p=>p.id===sel[1]);
  const pair=[a,b].filter(Boolean).sort((x,y)=>x.date.localeCompare(y.date));
  const html=`<div class="panel"><label class="field" for="photoDate">Datum des Fotos<input id="photoDate" type="date" max="${todayKey()}" value="${todayKey()}"></label>
      <label class="btn primary" for="photoInput" style="cursor:pointer">Foto hinzufügen</label><input id="photoInput" type="file" accept="image/*" hidden>
      <span class="muted tiny">Fotos bleiben nur auf diesem iPhone und sind nicht im Text-Backup enthalten.</span></div>
    ${pair.length===2?`<h2>Vergleich</h2><div class="panel"><div class="compare">${pair.map(p=>`<figure><img src="${p.data}" alt="Fortschrittsfoto vom ${fmtDay(p.date)}"><figcaption>${fmtDay(p.date)}${latestWeightAt(p.date)?' · '+fmt1(latestWeightAt(p.date))+' kg':''}</figcaption></figure>`).join('')}</div>
      <span class="muted tiny">${Math.round((parseYmd(pair[1].date)-parseYmd(pair[0].date))/864e5)} Tage dazwischen</span></div>`:''}
    <h2>Alle Fotos</h2>${PHOTOS.length?`<p class="muted small" style="margin:0">Zwei Fotos antippen, um sie zu vergleichen.</p><div class="photos">${PHOTOS.map(p=>`<button class="${sel.includes(p.id)?'sel':''}" data-a="photoSel" data-id="${p.id}" aria-label="Foto vom ${fmtDay(p.date)}"><img src="${p.data}" alt=""><span>${fmtDay(p.date)}</span></button>`).join('')}</div>
      ${sel.length?`<div class="rowflex"><button class="btn sm" data-a="photoClear">Auswahl aufheben</button>${c.confirmDel?`<button class="btn sm danger" data-a="photoDelYes">Wirklich löschen</button>`:`<button class="btn sm danger" data-a="photoDel">${sel.length} löschen</button>`}</div>`:''}`:'<div class="panel muted">Noch keine Fotos.</div>'}`;
  return{title:'Fortschrittsfotos',html};
},
profile(c){
  const p=S.profile,w=latestWeight(),b=bmiVal(),a=ageYears(),bf=bodyFat(),f=goalForecast(),bmr=estBMR();
  const prim=bf[0];
  let goal='';
  if(p.targetWeight&&w){
    const st=p.goalStart&&p.goalStart.weight?p.goalStart:{weight:w.v,date:w.k};
    const total=p.targetWeight-st.weight,doneKg=w.v-st.weight,prog=total?doneKg/total:1;
    goal=`<div class="panel"><div class="rowflex"><b>Ziel: ${fmt1(p.targetWeight)} kg</b><span class="muted small">noch ${fmt1(Math.abs(p.targetWeight-w.v))} kg</span></div>
      ${bar(Math.max(0,prog),prog>=1?'good':'',true)}
      <span class="muted tiny">Start ${fmt1(st.weight)} kg am ${fmtDay(st.date)} · bisher ${doneKg>0?'+':''}${fmt1(doneKg)} kg</span>
      ${f&&f.reached?'<b class="pos">Zielgewicht erreicht.</b>':`
      <div class="fc"><span class="muted tiny">Nach Gewichtstrend</span><b>${f&&f.trendWeeks?weeksText(f.trendWeeks):f&&f.trendPerWeek!=null?'Trend geht gerade in die andere Richtung':'Noch zu wenig Wiegungen'}</b>
        <span class="muted tiny">${f&&f.trendPerWeek!=null?`${f.trendPerWeek>0?'+':''}${fmt1(f.trendPerWeek)} kg pro Woche, berechnet aus den letzten 6 Wochen`:'Braucht mindestens 3 Wiegungen über 7 Tage'}</span></div>
      <div class="fc"><span class="muted tiny">Nach Kalorienbilanz</span><b>${f&&f.defWeeks?weeksText(f.defWeeks):f&&f.defAvg!=null?'Bilanz passt gerade nicht zur Richtung':'Noch zu wenig Ernährungsdaten'}</b>
        <span class="muted tiny">${f&&f.defAvg!=null?`Ø ${f.defAvg>=0?'Defizit':'Überschuss'} ${fmtInt(Math.abs(f.defAvg))} kcal pro Tag ≈ ${f.defPerWeek>0?'+':''}${fmt1(f.defPerWeek)} kg pro Woche`:'Braucht Ernährungsdaten an mindestens 5 der letzten 14 Tage'}</span></div>
      ${(()=>{const g=goalPlan();if(!g||g.reached)return '';if(g.missing)return '<span class="small muted">Für einen Kalorienplan fehlen Größe, Geburtsdatum oder Geschlecht.</span>';
        return `<div class="fc" style="background:var(--accent-soft)"><span class="tiny">Dein Plan bei ${g.dir<0?'−':'+'}${g.pace.toLocaleString('de-DE')} kg pro Woche</span>
          <div class="seg" style="margin:6px 0">${[0.25,0.5,0.75,1].map(p=>`<button class="${g.pace===p?'on':''}" data-a="pace" data-p="${p}">${p.toLocaleString('de-DE')} kg</button>`).join('')}</div>
          <b>${fmtInt(g.intake)} kcal pro Tag essen</b>
          <span class="small">Ziel erreicht in ca. ${Math.round(g.weeks)} Wochen · ${g.date.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})}</span>
          <span class="muted tiny">Verbrauch ≈ ${fmtInt(g.tdee)} kcal/Tag (Ruheenergie + Ø aktive Energie der letzten 14 Tage${g.actEstimated?', aktiv geschätzt mit 300 kcal':''}).</span>
          ${g.belowBmr?'<span class="small st-missed">Das liegt unter deinem Grundumsatz. Wähle ein langsameres Tempo.</span>':''}
          <div style="margin-top:8px">${ppkControl('ppkPlan')}</div>
          <button class="btn sm primary" data-a="applyPlan" style="margin-top:6px">Als Ernährungsziel übernehmen</button></div>`})()}

function checkRecap(){
  const last=addDays(weekStart(new Date()),-7),k=ymd(last);
  if(S.recapSeen===k||!$('#modal').hidden) return;
  const sm=weekSummary(last);
  if(!(sm.defDays||weekCount(last)||sm.parts.some(p=>p.t!=='Krafttraining'&&p.ev>0))){S.recapSeen=k;save();return}
  $('#modal').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rtitle"><div><span class="muted small">Wochenrückblick · ${weekRange(last)}</span><h3 id="rtitle">Deine Woche ${weekLabel(last)}</h3></div>
    ${weekSummaryHtml(sm)}<div class="rowflex"><button class="btn" data-a="recapClose">Schließen</button><button class="btn primary" data-a="recapOpen" data-k="${k}">Woche im Detail</button></div></div>`;
  $('#modal').hidden=false;
}

function card(k,tk,d){
  let val,det,p,st,extra='';
  if(k==='steps'){const g=S.settings.stepGoal;val=fmtInt(d.steps);det=`von ${fmtInt(g)} Schritten`;p=(d.steps||0)/g;st=stepsStatus(tk);
    const w=weekSteps(weekStart(new Date()));if(w.target){const ws2=weekAvgStatus(weekStart(new Date()));
      extra=`<span class="line2 small" style="margin-top:2px"><span>Wochen-Ø <b class="num">${fmtInt(w.avg)}</b></span><span class="detail">Ziel Ø ${fmtInt(w.target)}${ws2==='met'?' ✓':''}</span></span>${bar(w.avg/w.target,ws2==='met'?'good':'k-steps')}`}}
  else if(k==='nutrition'){
    const tg=effNutrition(),act=NUTR.filter(([n])=>isSet(tg[n])),met=act.filter(([n])=>isMet(tg[n],d[n]||0)).length,ref=tg.kcal?(tg.kcal.max??tg.kcal.min):null;
    val=`${fmtInt(d.kcal)} kcal`;det=act.length?`${met} von ${act.length} Werten im Ziel`:'Keine Zielwerte festgelegt';
    p=ref?(d.kcal||0)/ref:(act.length?met/act.length:0);st=nutrStatus(tk);
  }else{const c=weekCount(weekStart(new Date())),t=S.settings.weekly;val=`${c} / ${t}`;det='Einheiten diese Woche';p=c/t;st=c>=t?'met':'pending'}
  return `<button class="card ${st==='met'?'met':''} ${st==='missed'?'missed':''}" data-a="push" data-v="${k}">
    <span class="head"><span class="ico ico-${k}">${ICON[k]}</span><span class="grow">${GOALS[k].t}</span>${st==='met'?'<span class="small">Erreicht</span>':''}<span aria-hidden="true">›</span></span>
    <span class="line2"><span class="val">${val}</span><span class="detail">${det}</span></span>${bar(p,st==='missed'?'bad':'k-'+k)}${extra||''}</button>`;
}

// Schritte: Wochendurchschnitt (Mo–So)
function weekSteps(ws){
  const tk=todayKey(),keys=Array.from({length:7},(_,i)=>ymd(addDays(ws,i))),past=keys.filter(k=>k<=tk);
  const sum=past.reduce((a,k)=>a+(S.days[k]?.steps||0),0),before=past.filter(k=>k<tk).reduce((a,k)=>a+(S.days[k]?.steps||0),0);
  const done=keys[6]<tk,daysLeft=done?0:7-past.filter(k=>k<tk).length;
  const target=S.settings.stepWeekAvg||0;
  return{keys,past,sum,avg:past.length?sum/past.length:0,weekAvg:sum/7,done,target,
    needed:target&&daysLeft?Math.max(0,(target*7-before)/daysLeft):0,daysLeft};
}
function weekAvgStatus(ws){
  const w=weekSteps(ws);if(!w.target||!w.past.length)return 'nodata';
  if(w.sum>=w.target*7)return 'met';
  return w.done?'missed':'pending';
}
// Allgemeines Balkendiagramm: items [{label,v,cls,title}], lines [{v,label,cls}]
function bars(items,lines,aria){
  const W=340,H=180,pl=4,pr=4,pt=16,pb=22,max=Math.max(1,...items.map(i=>i.v),...lines.map(l=>l.v))*1.1;
  const bw=(W-pl-pr)/items.length,y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  items.forEach((it,i)=>{const x=pl+i*bw+bw*.16,h=Math.max(H-pb-y(it.v),it.v?2:0);
    s+=`<rect class="${it.cls}" x="${x}" y="${H-pb-h}" width="${bw*.68}" height="${h}" rx="3"><title>${it.title||it.label+': '+fmtInt(it.v)}</title></rect>`;
    if(it.label) s+=`<text x="${x+bw*.34}" y="${H-6}" text-anchor="middle">${it.label}</text>`});
  lines.forEach(l=>{s+=`<line class="${l.cls}" x1="${pl}" x2="${W-pr}" y1="${y(l.v)}" y2="${y(l.v)}"/><text class="${l.cls}-t" x="${l.left?pl+2:W-pr}" y="${y(l.v)-4}" text-anchor="${l.left?'start':'end'}">${l.label}</text>`});
  return s+'</svg>';
}
function barChart(keys,goal){
  const W=340,H=170,pl=4,pr=4,pt=14,pb=20,vals=keys.map(k=>S.days[k]?.steps||0);
  const max=Math.max(goal,...vals)*1.08,bw=(W-pl-pr)/keys.length,y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schritte der letzten 14 Tage">`;
  keys.forEach((k,i)=>{const v=vals[i],x=pl+i*bw+bw*.18,h=Math.max(H-pb-y(v),v?2:0);
    s+=`<rect class="${v>=stepGoalFor(k)?'b-met':'b-no'}" x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="3"><title>${fmtDay(k)}: ${fmtInt(v)}</title></rect>`;
    if(i%2===(keys.length-1)%2) s+=`<text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${parseYmd(k).getDate()}.</text>`});
  s+=`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W-pr}" y="${y(goal)-4}" text-anchor="end">Ziel ${fmtInt(goal)}</text></svg>`;
  return s;
}

function prevSets(d,name){
  const key=norm(name); if(!key) return null;
  const others=sortedSessions().filter(s=>s.id!==d.id&&s.date<=d.date);
  const same=others.find(s=>d.templateId&&s.templateId===d.templateId);
  let e=same&&same.exercises.find(x=>norm(x.name)===key); if(e&&e.sets.length) return e.sets;
  for(const s of others){e=s.exercises.find(x=>norm(x.name)===key);if(e&&e.sets.length) return e.sets}
  return null;
}

// Vorwerte einer Übung aktualisieren, ohne die Seite neu aufzubauen (Fokus und Taps bleiben erhalten)
function updatePrev(i){
  const d=cur().draft,e=d&&d.ex[i];if(!e)return;
  const sec=document.getElementById('ex-'+i)?.closest('.ex');if(!sec)return;
  const prev=prevSets(d,e.name);let p=sec.querySelector('.prev');
  if(prev){if(!p){p=document.createElement('p');p.className='prev';sec.querySelector('.exname').after(p)}p.textContent=`Letztes Mal: (${setsSummary(prev)})`}else if(p)p.remove();
  e.sets.forEach((_,j)=>{const ps=prev&&prev[j];
    const w=document.getElementById(`w-${i}-${j}`),r=document.getElementById(`r-${i}-${j}`);
    if(w)w.placeholder=ps?fmtRaw(ps.w):'kg';if(r)r.placeholder=ps?ps.r:'Wdh';
    const sp=w&&w.closest('.setrow').querySelector('.ps');if(sp)sp.textContent=ps?`(${fmt1(ps.w)}×${ps.r})`:''});
}

const KEYMAP={stundenschritte:'stepsHour',schrittestunde:'stepsHour',schritte:'steps',steps:'steps',aktiv:'active',aktive:'active',active:'active',kcal:'kcal',kalorien:'kcal',energie:'kcal',nahrungsenergie:'kcal',protein:'protein',eiweiss:'protein','eiweiß':'protein',fett:'fat',fat:'fat',kh:'carbs',kohlenhydrate:'carbs',carbs:'carbs',ballaststoffe:'fiber',fiber:'fiber',datum:'date',date:'date',ruhe:'resting',ruheenergie:'resting',resting:'resting',gewicht:'weight',weight:'weight'};
const MONTHS=['jan','feb','mär','apr','mai','jun','jul','aug','sep','okt','nov','dez'];
const MONTHS_EN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WEEKDAYS=[['sonntag','sunday'],['montag','monday'],['dienstag','tuesday'],['mittwoch','wednesday'],['donnerstag','thursday'],['freitag','friday'],['samstag','saturday']];
function monthIdx(w){w=w.toLowerCase().replace('ä','a').slice(0,3);let i=MONTHS.map(m=>m.replace('ä','a')).indexOf(w);if(i<0)i=MONTHS_EN.indexOf(w);if(w==='mrz')i=2;return i}
function noYear(d,m){ // Datum ohne Jahr: dieses Jahr, außer es läge in der Zukunft
  const now=new Date();let x=new Date(now.getFullYear(),m,d);if(x>addDays(now,1))x=new Date(now.getFullYear()-1,m,d);return ymd(x)}
function parseDate(v){
  v=String(v).trim().toLowerCase();if(!v)return null;
  let m=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/); if(m) return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m=v.match(/(\d{1,2})\.?\s+([a-zäöü]{3,})\.?,?\s+(\d{4})/); if(m&&monthIdx(m[2])>=0) return `${m[3]}-${pad(monthIdx(m[2])+1)}-${pad(m[1])}`;
  m=v.match(/([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/); if(m&&monthIdx(m[1])>=0) return `${m[3]}-${pad(monthIdx(m[1])+1)}-${pad(m[2])}`;
  m=v.match(/(\d{1,2})\.?\s+([a-zäöü]{3,})/); if(m&&monthIdx(m[2])>=0) return noYear(+m[1],monthIdx(m[2]));
  m=v.match(/([a-z]{3,})\.?\s+(\d{1,2})(?!\d)/); if(m&&monthIdx(m[1])>=0) return noYear(+m[2],monthIdx(m[1]));
  m=v.match(/(\d{1,2})\.(\d{1,2})\.(?!\d)/); if(m) return noYear(+m[1],+m[2]-1);
  if(/vorgestern/.test(v)) return ymd(addDays(new Date(),-2));
  if(/gestern|yesterday/.test(v)) return ymd(addDays(new Date(),-1));
  if(/heute|today/.test(v)) return todayKey();
  for(let i=0;i<7;i++){if(WEEKDAYS[i].some(w=>v.includes(w))){const t=new Date();let back=(t.getDay()-i+7)%7;if(back===0)back=7;return ymd(addDays(t,-back))}}
  return null;
}
function importText(text){
  const blocks=[];let cur=null;
  for(const line of String(text).split(/\r?\n/)){
    const m=line.match(/^\s*([A-Za-zÄÖÜäöüß]+)\s*[:=]\s*(.*)$/);
    if(/^\s*fitdash\s*$/i.test(line)){if(cur&&Object.keys(cur).length)blocks.push(cur);cur={};continue}
    if(!m) continue; const f=KEYMAP[m[1].toLowerCase()]; if(!f) continue;
    cur=cur||{};
    if(f==='date'){if(cur.date||cur.badDate){blocks.push(cur);cur={}}const dk=parseDate(m[2]);if(dk){cur.date=dk;const hm=m[2].match(/T(\d{1,2}):|\s(\d{1,2}):\d{2}/);cur.hour=hm?+(hm[1]??hm[2]):null}else if(m[2].trim())cur.badDate=m[2].trim()}
    else if(f==='weight'){const w=parseImportNum(m[2]);if(w&&w>20)cur.weight=w}
    else cur[f]=parseImportNum(m[2])??0;
  }
  if(cur&&Object.keys(cur).length) blocks.push(cur);
  const done=[];importText.bad=[];
  // Stundenschritte von Watch und iPhone: pro Stunde den höheren Wert, dann zum Tag addieren
  const hourly={};importText.noHour=0;
  for(const b of blocks){
    if(b.badDate||b.stepsHour==null) continue;
    if(b.hour==null){importText.noHour++;delete b.stepsHour;continue}   // ohne Uhrzeit nicht verwertbar
    const k=b.date||todayKey(),h=b.hour,day=hourly[k]=hourly[k]||{};
    day[h]=Math.max(day[h]||0,b.stepsHour);delete b.stepsHour;
  }
  Object.entries(hourly).forEach(([k,hrs])=>blocks.push({date:k,steps:Math.round(Object.values(hrs).reduce((a,v)=>a+v,0))}));
  for(const b of blocks){
    if(b.badDate){importText.bad.push(b.badDate);continue}
    const k=b.date||todayKey(); const vals={};
    ['steps','active','resting',...NUTR.map(n=>n[0])].forEach(f=>{if(b[f]!=null) vals[f]=b[f]});
    if(b.weight){(S.body[k]=S.body[k]||{}).weight=Math.round(b.weight*10)/10}
    if(!Object.keys(vals).length){if(b.weight)done.push(k);continue}
    upsertDay(k,vals); done.push(k);
  }
  if(done.length){S.lastSync=Date.now();save()}
  return done;
}
function doImport(text){
  const done=importText(text);
  const bad=importText.bad||[];
  const noHourMsg=importText.noHour?`${importText.noHour} Stundenwerte ohne Uhrzeit wurden ignoriert. Schalte im Kurzbefehl beim Startdatum „ISO 8601-Zeit“ ein.`:'';
  if(bad.length&&!done.length){const c=stacks.sync[0];c.msg=null;c.err=`Das Datum wurde nicht erkannt: „${esc(bad[0])}“. Bitte schick diesen Text an Claude oder stell im Kurzbefehl beim Startdatum das Format „ISO 8601“ ein.`;tab='sync';stacks.sync=[c];render();return}
  if(!done.length&&noHourMsg){const c=stacks.sync[0];c.msg=null;c.err=noHourMsg;tab='sync';stacks.sync=[c];render();return}
  if(!done.length){
    const c=stacks.sync[0];c.msg=null;
    c.err=String(text||'').trim()?`Im eingefügten Text wurden keine Werte erkannt. Angekommen ist: „${esc(String(text).trim().slice(0,160))}“`:'Die Zwischenablage war leer. Der Kurzbefehl hat nichts kopiert: Prüfe, ob am Ende „In Zwischenablage kopieren“ mit „Text“ steht.';
    tab='sync';stacks.sync=[c];render();const b=$('#pastebox');if(b)b.value=String(text||'');return}
  stacks.sync[0].err=noHourMsg||null;
  const days=[...new Set(done)].sort(),k=days[days.length-1],d=S.days[k]||{};
  const c=stacks.sync[0]; c.msg=days.length>1?`${days.length} Tage übernommen (${fmtDay(days[0])} bis ${fmtDay(k)}).${bad.length?` ${bad.length} Block/Blöcke mit unbekanntem Datum übersprungen.`:''}`:`${fmtDayLong(k)}: ${fmtInt(d.steps)} Schritte, ${fmtInt(d.kcal)} kcal, ${fmt1(d.protein)} g Protein`;
  toast('Daten übernommen');
  tab='sync';stacks.sync=[c];render();
}

    if(!Object.keys(b).length)delete S.body[el.dataset.k];save();render()},

  rmMeasure(el){S.settings.measures=S.settings.measures.filter(m=>m!==el.dataset.m);save();render();toast('Maß ausgeblendet, Einträge bleiben erhalten')},
  recapClose(){closeRecap()},
  recapOpen(el){closeRecap();tab='cal';stacks.cal=[stacks.cal[0],{v:'week',k:el.dataset.k}];render();window.scrollTo(0,0)}
};
const INPUTS={
  prof(el){const f=el.dataset.f,p=S.profile,v=el.value.trim();
    if(f==='name')p.name=v;
    else if(f==='birth')p.birth=v||null;
    else if(f==='height'){const n=parseNum(v);p.height=n&&n>100&&n<250?Math.round(n):null}
    else if(f==='targetWeight'){const n=parseNum(v);const nv=n&&n>20?Math.round(n*10)/10:null;
      if(nv!==p.targetWeight){p.targetWeight=nv;const w=latestWeight();p.goalStart=nv&&w?{date:w.k,weight:w.v}:null}}
    save();refreshLive()},
  ppk(el){const v=parseNum(el.value);S.settings.proteinPerKg=v&&v>0&&v<5?v:null;if(S.days[todayKey()])upsertDay(todayKey(),{});save();
    document.querySelectorAll('.ppk-info').forEach(x=>x.textContent=ppkInfo());
    el.closest('.ppkbox').querySelectorAll('[data-a="ppkSet"]').forEach(b=>b.classList.toggle('on',String(parseNum(b.dataset.v)||'')===String(S.settings.proteinPerKg||'')));
    if(cur().v==='nutrition')refreshLive()},
  stepWeekAvg(el){const n=parseNum(el.value);S.settings.stepWeekAvg=n&&n>0?Math.round(n):null;save();refreshLive()},
  stepGoal(el){const n=parseNum(el.value);if(n&&n>0){S.settings.stepGoal=Math.round(n);upsertDay(todayKey(),{});save();refreshLive()}},
  target(el){const k=el.dataset.k,t=S.settings.nutrition[k]||{min:null,max:null};t[el.dataset.m]=el.value.trim()===''?null:parseNum(el.value);
    if(isSet(t))S.settings.nutrition[k]=t;else delete S.settings.nutrition[k];if(S.days[todayKey()])upsertDay(todayKey(),{});save();refreshLive()},
  tname(el){cur().draft.name=el.value},
  tex(el){cur().draft.exercises[Number(el.dataset.i)][el.dataset.f]=el.value},
  sTitle(el){cur().draft.title=el.value},
  sDate(el){if(el.value)cur().draft.date=el.value>todayKey()?todayKey():el.value},
  sPast(el){const d=cur().draft;d.past=el.checked;if(!d.past)d.date=todayKey();else if(d.date===todayKey())d.date=ymd(addDays(new Date(),-1));render()},
  exName(el){cur().draft.ex[Number(el.dataset.i)].name=el.value},
  set(el){cur().draft.ex[Number(el.dataset.i)].sets[Number(el.dataset.j)][el.dataset.f]=el.value},
  updT(el){cur().draft.updT=el.checked},
  manual(el){const v=el.value.trim()===''?null:parseNum(el.value);upsertDay(el.dataset.k,{[el.dataset.f]:v??0});save();refreshLive()},
  scname(el){S.settings.shortcut=el.value.trim()||'FitDash Sync';save()},
  bmr(el){const v=parseNum(el.value);S.settings.bmr=v&&v>0?Math.round(v):null;save()},
  manualW(el){const k=el.dataset.k,v=parseNum(el.value),b=S.body[k]=S.body[k]||{};if(v&&v>20)b.weight=Math.round(v*10)/10;else delete b.weight;if(!Object.keys(b).length)delete S.body[k];save()}
};

/* ---------- Events ---------- */
let pendingSync=false;
document.addEventListener('pointerdown',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{passive:true});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.in==='set')ensureAudio()});
document.addEventListener('click',e=>{
  const tb=e.target.closest('nav.tabs button');if(tb){switchTab(tb.dataset.tab);return}
  if(e.target.closest('#back')){back();return}
  if(e.target.closest('#avatar')){push({v:'profile'});return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName!=='A')e.preventDefault();
  fn(el);
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&INPUTS[el.dataset.in])INPUTS[el.dataset.in](el)});
document.addEventListener('change',async e=>{
  if(e.target.id==='photoInput'&&e.target.files[0]){try{const data=await shrinkImage(e.target.files[0]);await idbPut({id:uid(),date:($('#photoDate')||{}).value||todayKey(),data});await loadPhotos();render();toast('Foto gespeichert')}catch(err){toast('Foto konnte nicht gespeichert werden')}return}
  if(e.target.id==='restoreFile'&&e.target.files[0]){try{const o=JSON.parse(await e.target.files[0].text());if(!o.settings||!o.days)throw 0;S=Object.assign(defaults(),o);S.settings=Object.assign(defaults().settings,o.settings);S.profile=Object.assign(defaults().profile,o.profile||{});save();applyTheme();toast('Backup wiederhergestellt');render()}catch(err){toast('Das ist keine gültige FitDash-Backup-Datei')}return}
  const el=e.target.closest('[data-in]');if(!el)return;
  if(el.dataset.in==='set'&&el.dataset.f==='r'&&el.value.trim()){const d=cur().draft,ex=d&&d.ex[Number(el.dataset.i)];if(ex)startRest(restFor(d,ex.name),ex.name)}
  if(el.dataset.in==='exName')updatePrev(Number(el.dataset.i));   // Vorwerte neu suchen
  if(el.dataset.in==='sDate')cur().draft.ex.forEach((_,i)=>updatePrev(i));
});
// Text sichtbar einfügen lassen, danach übernehmen
document.addEventListener('paste',e=>{
  if(e.target.id!=='pastebox')return;
  setTimeout(()=>{const b=$('#pastebox');doImport(b?b.value:'')},250);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(pendingSync&&tab==='sync'){pendingSync=false;toast('Jetzt „2 · Daten einfügen“ tippen')}
    render();   // neuer Tag oder neue Woche: Werte neu berechnen
    checkRecap();
  }
});
applyTheme();
render();
checkRecap();
loadPhotos().then(()=>{if(PHOTOS.length&&cur().v==='profile')render()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body></html>
