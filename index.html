<html lang="de">
<head>

<body>
<title>FitDash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: einspaltige App-Hülle (max. 560px), Kopfzeile oben, Tab-Leiste unten, Karten für Ziele */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --fg:#131923; --muted:#5b6678; --line:#d6dce5;
  --accent:#2c56cc; --accent-fg:#ffffff; --accent-soft:#dfe6fa;
  --good:#18924d; --good-soft:#d9f1e3; --bad:#cf3b3b; --warn:#d07c12; --nodata:#c2c9d4;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c25; --surface-2:#212a36; --fg:#e7ebf1; --muted:#95a1b3; --line:#2a3340;
  --accent:#7495ff; --accent-fg:#0d1117; --accent-soft:#1d2946;
  --good:#2bb366; --good-soft:#163524; --bad:#f06262; --warn:#f2a142; --nodata:#3a4351; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c25; --surface-2:#212a36; --fg:#e7ebf1; --muted:#95a1b3; --line:#2a3340;
  --accent:#7495ff; --accent-fg:#0d1117; --accent-soft:#1d2946;
  --good:#2bb366; --good-soft:#163524; --bad:#f06262; --warn:#f2a142; --nodata:#3a4351; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
header.top h1{font-family:var(--font-display);font-size:28px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{color:var(--muted);font-size:13px}
.backbtn{border:0;background:var(--surface-2);color:var(--fg);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.titlewrap{min-width:0;flex:1}
main{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--font-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 -4px}
.panel{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.list>*{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.list>*:last-child{border-bottom:0}
button.rowbtn{cursor:pointer}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:20px;padding:16px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.card .head{display:flex;align-items:center;gap:8px;font-weight:600}
.card .head svg{width:20px;height:20px}
.card .val{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.card .line2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .detail{color:var(--muted);font-size:14px}
.card.met{background:var(--good);color:#fff}
.card.met .detail{color:rgba(255,255,255,.88)}
.card.met .bar{background:rgba(255,255,255,.3)} .card.met .bar i{background:#fff}
.card.missed{border-color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.big{height:12px}
.bar i.good{background:var(--good)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-met{color:var(--good)} .st-missed{color:var(--bad)} .st-pending{color:var(--warn)} .st-nodata{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--surface-2);color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:90px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.minmax{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;flex-wrap:wrap}
.syncline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ring{display:grid;place-items:center;position:relative;margin:6px auto}
.ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.ring .c{position:absolute;text-align:center}
.ring .c b{display:block;font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:16}
.ring .trk{stroke:var(--good-soft)} .ring .prg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .4s}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .b-met{fill:var(--good)} .chart .b-no{fill:var(--accent)} .chart .goal{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:1.2}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);font-size:22px;cursor:pointer}
.stepper b{font-family:var(--font-display);font-size:22px;min-width:2ch;text-align:center}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.ex .exname{font-weight:600;font-size:16px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0}
.prev{font-size:13px;color:var(--muted);margin:0}
.setrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto minmax(0,1fr) auto auto 30px;gap:6px;align-items:center}
.setrow input{text-align:right;padding:8px}
.setrow .ps{font-size:12px;color:var(--muted);white-space:nowrap}
.xbtn{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:30px;height:30px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 56px 76px 30px;gap:6px;align-items:end}
.rowflex{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--font-display);font-size:20px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 34px;gap:2px;background:var(--surface);border-radius:var(--r);padding:8px 6px}
.calgrid .wd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.day{border:0;background:none;color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;border-radius:10px;cursor:pointer;min-height:52px}
.day .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--accent);color:var(--accent-fg);font-weight:700}
.day.out{opacity:.35}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--nodata)}
.dot.met{background:var(--good)} .dot.missed{background:var(--bad)} .dot.pending{background:var(--warn)} .dot.nodata{background:var(--nodata)}
.dot.booked{background:var(--accent)} .dot.none{background:transparent}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted)}
.wk .dot{width:10px;height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.steps-guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps-guide li{padding-left:2px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
pre.mono{display:block;padding:10px;white-space:pre;overflow-x:auto;margin:0}
details{background:var(--surface);border-radius:var(--r);padding:12px 16px}
details summary{font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.check{display:flex;align-items:center;gap:10px}
.check input{width:22px;height:22px;flex:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tbl th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tfoot td{font-weight:700;border-bottom:0}
table.tbl tr.click{cursor:pointer}
.pos{color:var(--good)} .neg{color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer;min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sc-good{color:var(--good)} .sc-ok{color:var(--accent)} .sc-warn{color:var(--warn)} .sc-bad{color:var(--bad)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .vl{fill:var(--fg);font-weight:600;font-size:11px}
.wkbtn{border:0;background:none;font:inherit;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;padding:0}
.wkbtn small{font-size:9px;font-weight:500;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--bg);border-radius:22px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--font-display);font-size:24px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <button class="backbtn" id="back" hidden aria-label="Zurück"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="titlewrap"><h1 id="title">Heute</h1><div class="sub" id="subtitle"></div></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="home" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Dashboard</button>
  <button data-tab="cal"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
  <button data-tab="stats"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
  <button data-tab="sync"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>Sync</button>
  <button data-tab="more"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mehr</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script>
"use strict";
/* ---------- Grunddaten ---------- */
const ICON={
  steps:'<svg class="i" viewBox="0 0 24 24"><path d="M8 3c1.7 0 3 2 3 4.5S10 12 8 12s-3-2-3-4.5S6.3 3 8 3zM6 14h4l-.5 4a2 2 0 0 1-3 0zM16 7c1.7 0 3 2 3 4.5S18 16 16 16s-3-2-3-4.5S14.3 7 16 7zM14 18h4l-.5 2.5a2 2 0 0 1-3 0z"/></svg>',
  nutrition:'<svg class="i" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 0-3 3-3 7h3v11"/></svg>',
  workout:'<svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>'
};
const GOALS={steps:{t:'Schritte'},nutrition:{t:'Ernährung'},workout:{t:'Krafttraining'}};
const NUTR=[['kcal','Kalorien','kcal'],['protein','Protein','g'],['fat','Fett','g'],['carbs','Kohlenhydrate','g'],['fiber','Ballaststoffe','g']];
const STATUS={met:'erreicht',missed:'verfehlt',pending:'läuft noch',nodata:'keine Daten'};
const KEY='fitdash.v1';

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const todayKey=()=>ymd(new Date());
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmtInt=n=>Math.round(n||0).toLocaleString('de-DE');
const fmt1=n=>(Math.round((n||0)*10)/10).toLocaleString('de-DE',{maximumFractionDigits:1});
const fmtRaw=n=>n==null?'':String(Math.round(n*10)/10).replace('.',',');
const fmtDay=k=>parseYmd(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const fmtDayLong=k=>parseYmd(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $=s=>document.querySelector(s);

// Werte aus dem Kurzbefehl: ohne Tausendertrennung, Komma oder Punkt = Dezimalzeichen (z. B. 285,956)
function parseImportNum(s){
  const m=String(s??'').match(/-?\d+(?:[.,]\d+)?/); if(!m) return null;
  const n=parseFloat(m[0].replace(',','.')); return isFinite(n)?n:null;
}
function parseNum(s){
  const m=String(s??'').match(/-?[\d.,]+/); if(!m) return null;
  let t=m[0];
  if(t.includes('.')&&t.includes(',')){
    t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  }else if(t.includes(',')){
    const p=t.split(','); t=(p.length===2&&p[1].length!==3)?t.replace(',','.'):t.replace(/,/g,'');
  }else if(t.includes('.')){
    const p=t.split('.'); if(p.length>2||p[1].length===3) t=t.replace(/\./g,'');
  }
  const n=parseFloat(t); return isFinite(n)?n:null;
}

/* ---------- Speicher ---------- */
const MEASURES_DEFAULT=['Brust','Taille','Bauch','Hüfte','Oberarm','Oberschenkel','Wade','Körperfett'];
const mUnit=n=>/fett/i.test(n)?'%':'cm';
function defaults(){return{settings:{dashboard:['steps','nutrition','workout'],stepGoal:10000,nutrition:{},weekly:4,shortcut:'FitDash Sync',bmr:null,measures:[...MEASURES_DEFAULT]},days:{},body:{},templates:[],sessions:[],demo:false,lastSync:null,recapSeen:null}}
// Wiederholungen als Bereich, z. B. 6–10

  if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];return{repsMin:Math.max(1,a),repsMax:Math.max(1,b)}}

// Trainingsplan als Text: Überschrift = Einheit, Zeilen = Nr. Übung Sätze Wdh.
function parsePlan(text){
  const out=[];let cur=null;
  for(let line of String(text).split(/\r?\n/)){
    line=line.replace(/\u00a0/g,' ').trim(); if(!line||/^nr\.?(\s|\t|$)/i.test(line)||/^(gesamt|summe)\b/i.test(line)) continue;
    const cols=line.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    let name,sets,reps;
    if(cols.length>=4&&/^\d+$/.test(cols[0])){[,name,sets,reps]=cols}
    else{const m=line.match(/^\d+[.)]?\s+(.+?)\s+(\d+)\s*(?:x|×)?\s+(\d+\s*(?:[-–—]|bis)\s*\d+|\d+)\s*(?:wdh\.?)?$/i);if(m){[,name,sets,reps]=m}}
    if(name&&!cur){cur={name:'Einheit '+(out.length+1),exercises:[]};out.push(cur)}
    if(name&&cur){const r=parseRange(reps);cur.exercises.push({name,sets:Math.max(1,parseInt(sets)||1),...(r||{repsMin:10,repsMax:10})})}
    else if(!/^\d/.test(line)){cur={name:line.replace(/\s+[-–]\s+/,' – '),exercises:[]};out.push(cur)}
  }
  return out.filter(t=>t.exercises.length);
}

let S=load();

/* ---------- Auswertung ---------- */
const isSet=t=>t&&(t.min!=null||t.max!=null);
const isMet=(t,v)=>!((t.min!=null&&v<t.min)||(t.max!=null&&v>t.max));
function stepGoalFor(k){const d=S.days[k];return(k!==todayKey()&&d&&d.snap&&d.snap.stepGoal)?d.snap.stepGoal:S.settings.stepGoal}
function targetsFor(k){const d=S.days[k];return(k!==todayKey()&&d&&d.snap&&d.snap.nutrition)?d.snap.nutrition:S.settings.nutrition}
function stepsStatus(k){
  const isT=k===todayKey(),d=S.days[k];
  if(!d||d.steps==null) return isT?'pending':'nodata';
  if(d.steps>=stepGoalFor(k)) return 'met';
  return isT?'pending':'missed';
}
const hasNutr=d=>d&&NUTR.some(([k])=>(d[k]||0)>0);
function nutrStatus(k){
  const isT=k===todayKey(),tg=targetsFor(k),act=NUTR.filter(([n])=>isSet(tg[n]));
  if(!act.length) return 'nodata';
  const d=S.days[k]; if(!hasNutr(d)) return isT?'pending':'nodata';
  if(act.every(([n])=>isMet(tg[n],d[n]||0))) return 'met';
  if(isT) return act.some(([n])=>tg[n].max!=null&&(d[n]||0)>tg[n].max)?'missed':'pending';
  return 'missed';
}
function nutrientStatus(t,v){if(!isSet(t))return 'nodata';if(isMet(t,v))return 'met';if(t.max!=null&&v>t.max)return 'missed';return 'pending'}
function weekCount(ws){const s=ymd(ws),e=ymd(addDays(ws,7));return S.sessions.filter(x=>x.date>=s&&x.date<e).length}
function weekStatus(ws){
  const c=weekCount(ws); if(c>=S.settings.weekly) return 'met';
  const now=new Date(); if(ws>now) return 'nodata';
  return addDays(ws,7)>now?'pending':'missed';
}

const KCAL_PER_KG=7700;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function burnedFor(d){if(!d)return 0;const rest=d.resting>0?d.resting:(S.settings.bmr||0);return(d.active||0)+rest}
function restingMissing(keys){return !S.settings.bmr&&keys.some(k=>hasNutr(S.days[k])&&!(S.days[k].resting>0))}

function weekSummary(ws){
  const tk=todayKey(),keys=Array.from({length:7},(_,i)=>ymd(addDays(ws,i))),past=keys.filter(k=>k<=tk),en=S.settings.dashboard;
  const parts=[];
  if(en.includes('steps')){const st=past.map(stepsStatus),met=st.filter(x=>x==='met').length,ev=st.filter(x=>x==='met'||x==='missed').length;parts.push({t:'Schritte',met,ev,r:ev?met/ev:null,txt:`${met} von ${ev} Tagen`})}
  if(en.includes('nutrition')){const st=past.map(nutrStatus),met=st.filter(x=>x==='met').length,ev=st.filter(x=>x==='met'||x==='missed').length;parts.push({t:'Ernährung',met,ev,r:ev?met/ev:null,txt:`${met} von ${ev} Tagen`})}
  if(en.includes('workout')){const c=weekCount(ws),t=S.settings.weekly;parts.push({t:'Krafttraining',met:c,ev:t,r:Math.min(c/t,1),txt:`${c} von ${t} Einheiten`})}
  const rs=parts.filter(p=>p.r!=null),score=rs.length?Math.round(rs.reduce((a,p)=>a+p.r,0)/rs.length*100):null;
  const rows=deficitRows(ws),dd=rows.filter(r=>r.def!=null),total=dd.reduce((a,r)=>a+r.def,0);
  const wNow=avgWeight(keys[0],ymd(addDays(ws,7))),wPrev=avgWeight(ymd(addDays(ws,-7)),keys[0]);
  return{ws,keys,parts,score,rows,defDays:dd.length,defTotal:dd.length?total:null,defAvg:dd.length?total/dd.length:null,wNow,wPrev,wDelta:(wNow!=null&&wPrev!=null)?wNow-wPrev:null};

const scoreCls=x=>x==null?'st-nodata':x>=85?'sc-good':x>=65?'sc-ok':x>=40?'sc-warn':'sc-bad';
const scoreText=x=>x==null?'Noch keine Bewertung':x>=85?'Sehr gute Woche':x>=65?'Gute Woche':x>=40?'Solide, mit Luft nach oben':'Schwache Woche';
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y0)/864e5+1)/7)}
const weekLabel=ws=>`KW ${isoWeek(ws)}`;
const weekRange=ws=>`${ws.toLocaleDateString('de-DE',{day:'numeric',month:'short'})} – ${addDays(ws,6).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'})}`;

function allWeeks(){
  const keys=[...Object.keys(S.days).filter(k=>hasNutr(S.days[k])||S.days[k].steps),...S.sessions.map(s=>s.date),...Object.keys(S.body)].sort();
  if(!keys.length) return [];
  const out=[];for(let ws=weekStart(new Date());ymd(ws)>=ymd(weekStart(parseYmd(keys[0])));ws=addDays(ws,-7)) out.push(ws);

/* ---------- Zeitreihen ---------- */
const PER_LIMIT={week:12,month:12,year:20};
function groupKey(k,per){return per==='week'?ymd(weekStart(parseYmd(k))):per==='month'?k.slice(0,7):k.slice(0,4)}
function groupLabel(g,per){if(per==='week')return 'KW'+isoWeek(parseYmd(g));if(per==='month'){const[y,m]=g.split('-');return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'short'})+' '+y.slice(2)}return g}
function series(entries,per){
  const g={};entries.forEach(({k,v})=>{if(v==null||!isFinite(v))return;const key=groupKey(k,per);(g[key]=g[key]||[]).push(v)});
  return Object.keys(g).sort().slice(-PER_LIMIT[per]).map(key=>({g:key,label:groupLabel(key,per),v:g[key].reduce((a,b)=>a+b,0)/g[key].length,n:g[key].length}));
}
function lineChart(pts,unit){
  if(!pts.length) return '<p class="muted small" style="margin:0">Noch keine Daten für diesen Zeitraum.</p>';
  const W=340,H=180,pl=38,pr=14,pt=18,pb=24;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mx-mn<1){mn-=0.5;mx+=0.5}const padv=(mx-mn)*0.12;mn-=padv;mx+=padv;
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${unit}">`;
  [mn+padv,(mn+mx)/2,mx-padv].forEach(v=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${fmt1(v)}</text>`});
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join('');
  if(pts.length>1) s+=`<path class="ar" d="${path}L${x(pts.length-1)},${H-pb}L${x(0)},${H-pb}Z"/><path class="ln" d="${path}"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle class="pt${last?' last':''}" cx="${x(i)}" cy="${y(p.v)}" r="${last?4.5:3}"><title>${p.label}: ${fmt1(p.v)} ${unit}</title></circle>`;
    if((pts.length-1-i)%step===0) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="${last&&pts.length>1?'end':'middle'}">${p.label}</text>`});
  const lp=pts[pts.length-1];s+=`<text class="vl" x="${Math.min(x(pts.length-1),W-pr)}" y="${y(lp.v)-9}" text-anchor="end">${fmt1(lp.v)} ${unit}</text></svg>`;
  return s;
}
function trendKpis(pts,unit,lowerIsBetter){
  if(!pts.length) return '';
  const last=pts[pts.length-1],prev=pts[pts.length-2],first=pts[0];
  const d1=prev?last.v-prev.v:null,d2=pts.length>1?last.v-first.v:null;
  const cls=d=>d==null||Math.abs(d)<0.05?'':((d<0)===lowerIsBetter?'pos':'neg');
  const sg=d=>d==null?'–':(d>0?'+':'')+fmt1(d);
  return `<div class="kpis"><div class="kpi"><b>${fmt1(last.v)}</b><span>${unit} Ø ${last.label}</span></div>
    <div class="kpi"><b class="${cls(d1)}">${sg(d1)}</b><span>${unit} zum Vorzeitraum</span></div>
    <div class="kpi"><b class="${cls(d2)}">${sg(d2)}</b><span>${unit} seit ${first.label}</span></div></div>`;
}
function exerciseAvg(e){const w=e.sets.filter(x=>x.w>0).map(x=>x.w);return w.length?w.reduce((a,b)=>a+b,0)/w.length:null}

/* ---------- Navigation ---------- */
let tab='home';
const stacks={home:[{v:'dashboard'}],cal:[{v:'calendar',month:null}],stats:[{v:'stats',seg:'weeks',per:'week'}],sync:[{v:'sync'}],more:[{v:'more'}]};
const cur=()=>stacks[tab][stacks[tab].length-1];
function push(o){stacks[tab].push(o);render();window.scrollTo(0,0)}
function back(){if(stacks[tab].length>1){stacks[tab].pop();render()}}
function switchTab(t){if(t===tab&&stacks[t].length>1){stacks[t]=[stacks[t][0]]}tab=t;render();window.scrollTo(0,0)}
function render(){
  const c=cur(),r=VIEWS[c.v](c);
  $('#title').textContent=r.title;$('#subtitle').textContent=r.sub||'';
  $('#back').hidden=stacks[tab].length<2;
  $('#main').innerHTML=`<div id="live" style="display:contents">${r.top||''}</div>${r.html||''}`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}
function refreshLive(){const c=cur(),r=VIEWS[c.v](c);$('#live').innerHTML=r.top||''}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

calendar(c){
  if(!c.month){const n=new Date();c.month=new Date(n.getFullYear(),n.getMonth(),1)}
  const m=c.month,en=S.settings.dashboard,showW=en.includes('workout'),tk=todayKey();
  const first=weekStart(m),end=new Date(m.getFullYear(),m.getMonth()+1,1);
  const byDay={};S.sessions.forEach(s=>byDay[s.date]=(byDay[s.date]||0)+1);
  const weeks=[];
  let grid=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')+`<div class="wd">Wo</div>`;
  for(let ws=first;ws<end;ws=addDays(ws,7)){
    for(let i=0;i<7;i++){
      const day=addDays(ws,i),k=ymd(day),fut=k>tk;
      const dots=[];
      if(en.includes('steps')) dots.push(fut?'none':stepsStatus(k));
      if(en.includes('nutrition')) dots.push(fut?'none':nutrStatus(k));
      if(showW) dots.push(byDay[k]?'booked':'none');
      grid+=`<button class="day${day.getMonth()!==m.getMonth()?' out':''}${k===tk?' today':''}" data-a="day" data-k="${k}" aria-label="${fmtDayLong(k)}"><span class="n">${day.getDate()}</span><span class="dots">${dots.map(s=>`<i class="dot ${s}"></i>`).join('')}</span></button>`;
    }
    if(ws>new Date()) grid+='<div></div>';
    else{const sm=weekSummary(ws);grid+=`<button class="wkbtn ${scoreCls(sm.score)}" data-a="week" data-k="${ymd(ws)}" aria-label="${weekLabel(ws)} ansehen"><span class="num">${sm.score==null?'–':sm.score+'%'}</span><small class="num">${weekCount(ws)}/${S.settings.weekly}</small></button>`;weeks.push(sm)}
  }
  const html=`<div class="cal-head"><button class="btn sm" data-a="month" data-d="-1" aria-label="Vormonat">‹</button><b>${m.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn sm" data-a="month" data-d="1" aria-label="Nächster Monat">›</button></div>
    <div class="calgrid">${grid}</div>
    <div class="panel"><span class="small"><b>Punkte unter jedem Tag, von links:</b> ${en.filter(k=>k!=='workout').map(k=>GOALS[k].t).concat(showW?['Training gebucht']:[]).join(' · ')}</span>
    <div class="legend"><span><i class="dot met"></i>erreicht</span><span><i class="dot missed"></i>verfehlt</span><span><i class="dot pending"></i>läuft noch</span><span><i class="dot nodata"></i>keine Daten</span><span><i class="dot booked"></i>Training</span></div>
    <span class="muted tiny">Spalte „Wo“: Wochenbewertung in Prozent und gebuchte Trainings. Antippen öffnet den Wochenrückblick.</span></div>
    <h2>Wochen in diesem Monat</h2><div class="list">${weeks.length?[...weeks].reverse().map(weekRow).join(''):'<div class="muted">Noch keine Wochen.</div>'}</div>`;
  return{title:'Kalender',html};
},

function card(k,tk,d){
  let val,det,p,st;
  if(k==='steps'){const g=S.settings.stepGoal;val=fmtInt(d.steps);det=`von ${fmtInt(g)} Schritten`;p=(d.steps||0)/g;st=stepsStatus(tk)}
  else if(k==='nutrition'){
    const tg=S.settings.nutrition,act=NUTR.filter(([n])=>isSet(tg[n])),met=act.filter(([n])=>isMet(tg[n],d[n]||0)).length,ref=tg.kcal?(tg.kcal.max??tg.kcal.min):null;
    val=`${fmtInt(d.kcal)} kcal`;det=act.length?`${met} von ${act.length} Werten im Ziel`:'Keine Zielwerte festgelegt';
    p=ref?(d.kcal||0)/ref:(act.length?met/act.length:0);st=nutrStatus(tk);
  }else{const c=weekCount(weekStart(new Date())),t=S.settings.weekly;val=`${c} / ${t}`;det='Einheiten diese Woche';p=c/t;st=c>=t?'met':'pending'}
  return `<button class="card ${st==='met'?'met':''} ${st==='missed'?'missed':''}" data-a="push" data-v="${k}">
    <span class="head">${ICON[k]}<span class="grow">${GOALS[k].t}</span>${st==='met'?'<span class="small">Erreicht</span>':''}<span aria-hidden="true">›</span></span>
    <span class="line2"><span class="val">${val}</span><span class="detail">${det}</span></span>${bar(p,st==='missed'?'bad':'')}</button>`;
}

function barChart(keys,goal){
  const W=340,H=170,pl=4,pr=4,pt=14,pb=20,vals=keys.map(k=>S.days[k]?.steps||0);
  const max=Math.max(goal,...vals)*1.08,bw=(W-pl-pr)/keys.length,y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schritte der letzten 14 Tage">`;
  keys.forEach((k,i)=>{const v=vals[i],x=pl+i*bw+bw*.18,h=Math.max(H-pb-y(v),v?2:0);
    s+=`<rect class="${v>=stepGoalFor(k)?'b-met':'b-no'}" x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="3"><title>${fmtDay(k)}: ${fmtInt(v)}</title></rect>`;
    if(i%2===(keys.length-1)%2) s+=`<text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${parseYmd(k).getDate()}.</text>`});
  s+=`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W-pr}" y="${y(goal)-4}" text-anchor="end">Ziel ${fmtInt(goal)}</text></svg>`;
  return s;
}

function prevSets(d,name){
  const key=norm(name); if(!key) return null;
  const others=sortedSessions().filter(s=>s.id!==d.id&&s.date<=d.date);
  const same=others.find(s=>d.templateId&&s.templateId===d.templateId);
  let e=same&&same.exercises.find(x=>norm(x.name)===key); if(e&&e.sets.length) return e.sets;
  for(const s of others){e=s.exercises.find(x=>norm(x.name)===key);if(e&&e.sets.length) return e.sets}
  return null;
}

function updatePrev(i){
  const d=cur().draft,e=d&&d.ex[i];if(!e)return;
  const sec=document.getElementById('ex-'+i)?.closest('.ex');if(!sec)return;
  const prev=prevSets(d,e.name);let p=sec.querySelector('.prev');
  if(prev){if(!p){p=document.createElement('p');p.className='prev';sec.querySelector('.exname').after(p)}p.textContent=`Letztes Mal: (${setsSummary(prev)})`}else if(p)p.remove();
  e.sets.forEach((_,j)=>{const ps=prev&&prev[j];
    const w=document.getElementById(`w-${i}-${j}`),r=document.getElementById(`r-${i}-${j}`);
    if(w)w.placeholder=ps?fmtRaw(ps.w):'kg';if(r)r.placeholder=ps?ps.r:'Wdh';
    const sp=w&&w.closest('.setrow').querySelector('.ps');if(sp)sp.textContent=ps?`(${fmt1(ps.w)}×${ps.r})`:''});
}

const MONTHS_EN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WEEKDAYS=[['sonntag','sunday'],['montag','monday'],['dienstag','tuesday'],['mittwoch','wednesday'],['donnerstag','thursday'],['freitag','friday'],['samstag','saturday']];
function monthIdx(w){w=w.toLowerCase().replace('ä','a').slice(0,3);let i=MONTHS.map(m=>m.replace('ä','a')).indexOf(w);if(i<0)i=MONTHS_EN.indexOf(w);if(w==='mrz')i=2;return i}
function noYear(d,m){ // Datum ohne Jahr: dieses Jahr, außer es läge in der Zukunft
  const now=new Date();let x=new Date(now.getFullYear(),m,d);if(x>addDays(now,1))x=new Date(now.getFullYear()-1,m,d);return ymd(x)}
function parseDate(v){
  v=String(v).trim().toLowerCase();if(!v)return null;
  let m=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/); if(m) return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m=v.match(/(\d{1,2})\.?\s+([a-zäöü]{3,})\.?,?\s+(\d{4})/); if(m&&monthIdx(m[2])>=0) return `${m[3]}-${pad(monthIdx(m[2])+1)}-${pad(m[1])}`;
  m=v.match(/([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/); if(m&&monthIdx(m[1])>=0) return `${m[3]}-${pad(monthIdx(m[1])+1)}-${pad(m[2])}`;
  m=v.match(/(\d{1,2})\.?\s+([a-zäöü]{3,})/); if(m&&monthIdx(m[2])>=0) return noYear(+m[1],monthIdx(m[2]));
  m=v.match(/([a-z]{3,})\.?\s+(\d{1,2})(?!\d)/); if(m&&monthIdx(m[1])>=0) return noYear(+m[2],monthIdx(m[1]));
  m=v.match(/(\d{1,2})\.(\d{1,2})\.(?!\d)/); if(m) return noYear(+m[1],+m[2]-1);
  if(/vorgestern/.test(v)) return ymd(addDays(new Date(),-2));
  if(/gestern|yesterday/.test(v)) return ymd(addDays(new Date(),-1));
  if(/heute|today/.test(v)) return todayKey();
  for(let i=0;i<7;i++){if(WEEKDAYS[i].some(w=>v.includes(w))){const t=new Date();let back=(t.getDay()-i+7)%7;if(back===0)back=7;return ymd(addDays(t,-back))}}
  return null;
}
function importText(text){
  const blocks=[];let cur=null;
  for(const line of String(text).split(/\r?\n/)){
    const m=line.match(/^\s*([A-Za-zÄÖÜäöüß]+)\s*[:=]\s*(.*)$/);
    if(/^\s*fitdash\s*$/i.test(line)){if(cur&&Object.keys(cur).length)blocks.push(cur);cur={};continue}
    if(!m) continue; const f=KEYMAP[m[1].toLowerCase()]; if(!f) continue;
    cur=cur||{};
    if(f==='date'){if(cur.date||cur.badDate){blocks.push(cur);cur={}}const dk=parseDate(m[2]);if(dk){cur.date=dk;const hm=m[2].match(/T(\d{1,2}):|\s(\d{1,2}):\d{2}/);cur.hour=hm?+(hm[1]??hm[2]):0}else if(m[2].trim())cur.badDate=m[2].trim()}
    else if(f==='weight'){const w=parseImportNum(m[2]);if(w&&w>20)cur.weight=w}
    else cur[f]=parseImportNum(m[2])??0;
  }
  if(cur&&Object.keys(cur).length) blocks.push(cur);
  const done=[];importText.bad=[];
  // Stundenschritte von Watch und iPhone: pro Stunde den höheren Wert, dann zum Tag addieren
  const hourly={};
  for(const b of blocks){
    if(b.badDate||b.stepsHour==null) continue;
    const k=b.date||todayKey(),h=b.hour||0,day=hourly[k]=hourly[k]||{};
    day[h]=Math.max(day[h]||0,b.stepsHour);delete b.stepsHour;
  }
  Object.entries(hourly).forEach(([k,hrs])=>blocks.push({date:k,steps:Math.round(Object.values(hrs).reduce((a,v)=>a+v,0))}));
  for(const b of blocks){
    if(b.badDate){importText.bad.push(b.badDate);continue}
    const k=b.date||todayKey(); const vals={};
    ['steps','active','resting',...NUTR.map(n=>n[0])].forEach(f=>{if(b[f]!=null) vals[f]=b[f]});
    if(b.weight){(S.body[k]=S.body[k]||{}).weight=Math.round(b.weight*10)/10}
    if(!Object.keys(vals).length){if(b.weight)done.push(k);continue}
    upsertDay(k,vals); done.push(k);
  }
  if(done.length){S.lastSync=Date.now();save()}
  return done;
}
function doImport(text){
  const done=importText(text);
  const bad=importText.bad||[];
  if(bad.length&&!done.length){const c=stacks.sync[0];c.msg=null;c.err=`Das Datum wurde nicht erkannt: „${esc(bad[0])}“. Bitte schick diesen Text an Claude oder stell im Kurzbefehl beim Startdatum das Format „ISO 8601“ ein.`;tab='sync';stacks.sync=[c];render();return}
  if(!done.length){
    const c=stacks.sync[0];c.msg=null;
    c.err=String(text||'').trim()?`Im eingefügten Text wurden keine Werte erkannt. Angekommen ist: „${esc(String(text).trim().slice(0,160))}“`:'Die Zwischenablage war leer. Der Kurzbefehl hat nichts kopiert: Prüfe, ob am Ende „In Zwischenablage kopieren“ mit „Text“ steht.';
    tab='sync';stacks.sync=[c];render();const b=$('#pastebox');if(b)b.value=String(text||'');return}
  stacks.sync[0].err=null;
  const days=[...new Set(done)].sort(),k=days[days.length-1],d=S.days[k]||{};
  const c=stacks.sync[0]; c.msg=days.length>1?`${days.length} Tage übernommen (${fmtDay(days[0])} bis ${fmtDay(k)}).${bad.length?` ${bad.length} Block/Blöcke mit unbekanntem Datum übersprungen.`:''}`:`${fmtDayLong(k)}: ${fmtInt(d.steps)} Schritte, ${fmtInt(d.kcal)} kcal, ${fmt1(d.protein)} g Protein`;
  toast('Daten übernommen');
  tab='sync';stacks.sync=[c];render();
}

/* ---------- Aktionen ---------- */
const A={
  push:el=>push({v:el.dataset.v,id:el.dataset.id}),
  tab:el=>switchTab(el.dataset.t),
  clearDemo(){S=defaults();save();toast('Beispieldaten gelöscht');render()},
  toggleGoal(el){const k=el.dataset.k,a=S.settings.dashboard;S.settings.dashboard=a.includes(k)?a.filter(x=>x!==k):[...a,k];save();render()},
  moveGoal(el){const a=S.settings.dashboard,i=a.indexOf(el.dataset.k),j=i+Number(el.dataset.d);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
  weekly(el){S.settings.weekly=Math.max(1,Math.min(14,S.settings.weekly+Number(el.dataset.d)));save();render()},
  planMine(){$('#planbox').value=MY_PLAN;cur().text=MY_PLAN;cur().preview=parsePlan(MY_PLAN);render();$('#planbox').value=MY_PLAN},
  planPreview(){const t=$('#planbox').value;cur().text=t;cur().preview=parsePlan(t);render();$('#planbox').value=t},
  planSave(){const list=cur().preview||[];
    list.forEach(p=>{const ex=S.templates.find(t=>norm(t.name)===norm(p.name));if(ex)ex.exercises=p.exercises;else S.templates.push({id:uid(),name:p.name,exercises:p.exercises})});
    save();back();toast(list.length+' Vorlagen gespeichert')},
  newTemplate(){push({v:'tedit',draft:{name:'',exercises:[{name:'',sets:3,reps:'8-12'}]}})},
  editTemplate(el){const t=S.templates.find(x=>x.id===el.dataset.id);push({v:'tedit',id:t.id,draft:{name:t.name,exercises:t.exercises.map(e=>({name:e.name,sets:e.sets,reps:repRange(e).replace('–','-')}))}})},
  tAdd(){cur().draft.exercises.push({name:'',sets:3,reps:'8-12'});render()},
  tRm(el){cur().draft.exercises.splice(Number(el.dataset.i),1);render()},
  tSave(){const c=cur(),d=c.draft;if(!d.name.trim()){toast('Bitte einen Namen eingeben');return}
    const ex=d.exercises.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:Math.max(1,parseInt(e.sets)||1),...(parseRange(e.reps)||{repsMin:10,repsMax:10})}));
    if(c.id){Object.assign(S.templates.find(t=>t.id===c.id),{name:d.name.trim(),exercises:ex})}else S.templates.push({id:uid(),name:d.name.trim(),exercises:ex});
    save();back();toast('Vorlage gesichert')},
  tDel(){cur().confirmDel=true;render()},tDelNo(){cur().confirmDel=false;render()},
  tDelYes(){const id=cur().id;S.templates=S.templates.filter(t=>t.id!==id);save();stacks[tab]=stacks[tab].filter(x=>!(x.v==='template'&&x.id===id)&&!(x.v==='tedit'&&x.id===id));render();toast('Vorlage gelöscht')},
  startSession(el){const t=S.templates.find(x=>x.id===el.dataset.id);
    push({v:'session',draft:{templateId:t.id,title:t.name,date:el.dataset.k||todayKey(),updT:false,ex:t.exercises.map(e=>({name:e.name,sets:Array.from({length:e.sets},()=>({w:'',r:''}))}))}})},
  editSession(el){const s=S.sessions.find(x=>x.id===el.dataset.id);
    push({v:'session',draft:{id:s.id,templateId:s.templateId,title:s.title,date:s.date,updT:false,ex:s.exercises.map(e=>({name:e.name,sets:e.sets.map(x=>({w:fmtRaw(x.w),r:String(x.r)}))}))}})},
  sAddSet(el){const e=cur().draft.ex[Number(el.dataset.i)],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:l?l.r:''});render()},
  sRmSet(el){cur().draft.ex[Number(el.dataset.i)].sets.splice(Number(el.dataset.j),1);render()},
  sRmEx(el){cur().draft.ex.splice(Number(el.dataset.i),1);render()},
  sAddEx(){cur().draft.ex.push({name:'',sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]});render()},
  sSave(){const d=cur().draft;
    const exs=d.ex.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:e.sets.map(s=>({w:parseNum(s.w),r:parseNum(s.r)})).filter(s=>s.w!=null||s.r!=null).map(s=>({w:s.w||0,r:Math.round(s.r||0)}))}));
    const title=d.title.trim()||'Training';
    if(d.id) Object.assign(S.sessions.find(s=>s.id===d.id),{title,date:d.date,exercises:exs});
    else S.sessions.push({id:uid(),ts:Date.now(),date:d.date,templateId:d.templateId||null,title,exercises:exs});
    const t=d.updT&&S.templates.find(x=>x.id===d.templateId);
    if(t){const old={};t.exercises.forEach(e=>old[norm(e.name)]={repsMin:e.repsMin,repsMax:e.repsMax});
      t.exercises=d.ex.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:Math.max(1,e.sets.length),...(old[norm(e.name)]||parseRange(e.sets[0]?.r)||{repsMin:10,repsMax:10})}))}
    save();back();toast(d.id?'Training gesichert':'Training gebucht')},
  sDel(){cur().confirmDel=true;render()},sDelNo(){cur().confirmDel=false;render()},
  sDelYes(){const id=cur().draft.id;S.sessions=S.sessions.filter(s=>s.id!==id);save();back();toast('Training gelöscht')},
  month(el){const c=cur();c.month=new Date(c.month.getFullYear(),c.month.getMonth()+Number(el.dataset.d),1);render()},
  day(el){push({v:'day',k:el.dataset.k})},
  markSync(){pendingSync=true},
  async pasteClip(){
    try{const t=await navigator.clipboard.readText();const b=$('#pastebox');if(b)b.value=t||'';
      if(t&&t.trim()){setTimeout(()=>doImport(t),300);return}
      doImport('');return}catch(e){}
    const b=$('#pastebox');b.focus();toast('Lang ins Feld drücken und „Einsetzen“ wählen');
  },
  importBox(){doImport($('#pastebox').value)},
  manualToday(){push({v:'day',k:todayKey()})},
  async backupCopy(){const txt=JSON.stringify(S);
    try{await navigator.clipboard.writeText(txt);toast('Backup kopiert');}catch(e){const b=$('#restorebox');b.value=txt;b.select();toast('Text markiert, bitte kopieren')}},
  restore(){try{const o=JSON.parse($('#restorebox').value);if(!o.settings||!o.days)throw 0;S=Object.assign(defaults(),o);S.settings=Object.assign(defaults().settings,o.settings);save();toast('Backup wiederhergestellt');render()}catch(e){toast('Das ist kein gültiges FitDash-Backup')}},
  reset(){S._confirmReset=true;render()},resetNo(){delete S._confirmReset;render()},
  resetYes(){S=defaults();save();toast('Alle Daten gelöscht');render()},
  week(el){push({v:'week',k:el.dataset.k})},
  weekNav(el){const c=cur();c.k=ymd(addDays(parseYmd(c.k),Number(el.dataset.d)));render();window.scrollTo(0,0)},
  seg(el){cur().seg=el.dataset.s;render()},
  per(el){cur().per=el.dataset.p;render()},
  pickT(el){cur().t=el.dataset.t;render()},
  pickM(el){cur().m=el.dataset.m;render()},
  saveWeight(){const k=$('#wDate').value,v=parseNum($('#wVal').value);if(!k||!v||v<20){toast('Bitte Datum und Gewicht eingeben');return}
    (S.body[k]=S.body[k]||{}).weight=Math.round(v*10)/10;save();render();toast('Gewicht gespeichert')},
  saveMeasures(){const k=$('#mDate').value;if(!k)return;let n=0;const b=S.body[k]=S.body[k]||{};
    S.settings.measures.forEach((m,i)=>{const v=parseNum($('#m-'+i).value);if(v!=null){b[m]=v;n++}});
    if(!n){toast('Bitte mindestens ein Maß eintragen');return}save();render();toast(n+' Maße gespeichert')},
  delBody(el){const b=S.body[el.dataset.k];if(!b)return;
    if(el.dataset.f==='weight')delete b.weight;else S.settings.measures.forEach(m=>delete b[m]);
    if(!Object.keys(b).length)delete S.body[el.dataset.k];save();render()},
  addMeasure(){const v=$('#newMeasure').value.trim();if(!v||S.settings.measures.includes(v))return;S.settings.measures.push(v);save();render()},
  rmMeasure(el){S.settings.measures=S.settings.measures.filter(m=>m!==el.dataset.m);save();render();toast('Maß ausgeblendet, Einträge bleiben erhalten')},
  recapClose(){closeRecap()},
  recapOpen(el){closeRecap();tab='cal';stacks.cal=[stacks.cal[0],{v:'week',k:el.dataset.k}];render();window.scrollTo(0,0)}
};
const INPUTS={
  stepGoal(el){const n=parseNum(el.value);if(n&&n>0){S.settings.stepGoal=Math.round(n);upsertDay(todayKey(),{});save();refreshLive()}},
  target(el){const k=el.dataset.k,t=S.settings.nutrition[k]||{min:null,max:null};t[el.dataset.m]=el.value.trim()===''?null:parseNum(el.value);
    if(isSet(t))S.settings.nutrition[k]=t;else delete S.settings.nutrition[k];if(S.days[todayKey()])upsertDay(todayKey(),{});save();refreshLive()},
  tname(el){cur().draft.name=el.value},
  tex(el){cur().draft.exercises[Number(el.dataset.i)][el.dataset.f]=el.value},
  sTitle(el){cur().draft.title=el.value},
  sDate(el){if(el.value)cur().draft.date=el.value>todayKey()?todayKey():el.value},
  sPast(el){const d=cur().draft;d.past=el.checked;if(!d.past)d.date=todayKey();else if(d.date===todayKey())d.date=ymd(addDays(new Date(),-1));render()},
  exName(el){cur().draft.ex[Number(el.dataset.i)].name=el.value},
  set(el){cur().draft.ex[Number(el.dataset.i)].sets[Number(el.dataset.j)][el.dataset.f]=el.value},
  updT(el){cur().draft.updT=el.checked},
  manual(el){const v=el.value.trim()===''?null:parseNum(el.value);upsertDay(el.dataset.k,{[el.dataset.f]:v??0});save();refreshLive()},
  scname(el){S.settings.shortcut=el.value.trim()||'FitDash Sync';save()},
  bmr(el){const v=parseNum(el.value);S.settings.bmr=v&&v>0?Math.round(v):null;save()},
  manualW(el){const k=el.dataset.k,v=parseNum(el.value),b=S.body[k]=S.body[k]||{};if(v&&v>20)b.weight=Math.round(v*10)/10;else delete b.weight;if(!Object.keys(b).length)delete S.body[k];save()}
};

/* ---------- Events ---------- */
let pendingSync=false;
document.addEventListener('click',e=>{
  const tb=e.target.closest('nav.tabs button');if(tb){switchTab(tb.dataset.tab);return}
  if(e.target.closest('#back')){back();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName!=='A')e.preventDefault();
  fn(el);
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&INPUTS[el.dataset.in])INPUTS[el.dataset.in](el)});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-in]');if(!el)return;
  if(el.dataset.in==='exName')updatePrev(Number(el.dataset.i));   // Vorwerte neu suchen
  if(el.dataset.in==='sDate')cur().draft.ex.forEach((_,i)=>updatePrev(i));
});
// Text sichtbar einfügen lassen, danach übernehmen
document.addEventListener('paste',e=>{
  if(e.target.id!=='pastebox')return;
  setTimeout(()=>{const b=$('#pastebox');doImport(b?b.value:'')},250);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(pendingSync&&tab==='sync'){pendingSync=false;toast('Jetzt „2 · Daten einfügen“ tippen')}
    render();   // neuer Tag oder neue Woche: Werte neu berechnen
    checkRecap();
  }
});
render();
checkRecap();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
